name: Apply running widget refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_running_widget_refresh.py'
      - '.github/workflows/apply-running-widget-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_running_widget_refresh.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh widget after running changes"
            git push
          fi
