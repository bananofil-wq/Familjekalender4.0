name: Move recurring-life tools to settings

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/move_recurring_life_to_settings.py'
      - '.github/workflows/move-recurring-life-to-settings.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move recurring-life tools
        run: python3 scripts/move_recurring_life_to_settings.py
      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m 'Move recurring-life tools into settings'
          git push origin HEAD:main
