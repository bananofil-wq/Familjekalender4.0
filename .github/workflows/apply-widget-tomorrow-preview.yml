name: Apply widget tomorrow preview

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_widget_tomorrow_preview.py'
      - '.github/workflows/apply-widget-tomorrow-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_widget_tomorrow_preview.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyCalendarWidgetWorker.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add tomorrow preview to widget"
            git push
          fi
