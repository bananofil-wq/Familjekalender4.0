name: Phase 2 tomorrow planning

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/phase2_tomorrow_planning.py'
      - '.github/workflows/phase2-tomorrow-planning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Add tomorrow planning warnings
        run: python scripts/phase2_tomorrow_planning.py
      - name: Commit tomorrow planning support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git diff --cached --quiet || git commit -m "Add tomorrow planning warnings"
          git push
