name: Replace MonthPanel clean
on:
  push:
    paths:
      - '.github/workflows/replace-month-panel-clean.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace MonthPanel cleanly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()
          start = s.index('@Composable\nprivate fun MonthPanel(')
          end = s.index('@Composable\nprivate fun DayPanel(', start)
          new = '''@Composable
private fun MonthPanel(
    month: YearMonth,
    selected: LocalDate,
    onSelect: (LocalDate) -> Unit,
    events: List<SyncEvent>,
    members: List<SyncMember>,
    accent: Color,
    onPreviousMonth: () -> Unit,
    onNextMonth: () -> Unit,
    modifier: Modifier
) {
    val offset = month.atDay(1).dayOfWeek.value - 1
    val monthName = month.month.getDisplayName(TextStyle.FULL, Locale("sv", "SE")).replaceFirstChar { it.uppercase() }

    Card(
        modifier = modifier,
        shape = RoundedCornerShape(20.dp),
        colors = CardDefaults.cardColors(containerColor = Color(0xBF131820))
    ) {
        Column(Modifier.fillMaxSize().padding(horizontal = 10.dp, vertical = 10.dp)) {
            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                Text(
                    "$monthName ${month.year}",
                    color = Color.White,
                    fontSize = 18.sp,
                    fontWeight = FontWeight.Bold,
                    modifier = Modifier.weight(1f).padding(start = 4.dp, bottom = 8.dp)
                )
                TextButton(onClick = onPreviousMonth, contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp)) {
                    Text("‹", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                }
                TextButton(onClick = onNextMonth, contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp)) {
                    Text("›", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                }
            }

            Row(Modifier.fillMaxWidth()) {
                listOf("Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön").forEach { label ->
                    Text(
                        label,
                        color = Color(0xFFBBBAC2),
                        fontSize = 10.sp,
                        fontWeight = FontWeight.SemiBold,
                        textAlign = TextAlign.Center,
                        modifier = Modifier.weight(1f)
                    )
                }
            }

            Spacer(Modifier.height(5.dp))

            repeat(6) { week ->
                Row(Modifier.fillMaxWidth().weight(1f)) {
                    repeat(7) { column ->
                        val number = week * 7 + column - offset + 1
                        val day = if (number in 1..month.lengthOfMonth()) month.atDay(number) else null

                        if (day == null) {
                            Spacer(
                                Modifier
                                    .weight(1f)
                                    .fillMaxHeight()
                                    .padding(2.dp)
                            )
                        } else {
                            val selectedDay = day == selected
                            val dayEvents = events.filter { it.date == day }.take(3)

                            Card(
                                colors = CardDefaults.cardColors(
                                    containerColor = if (selectedDay) accent.copy(alpha = .88f) else Color(0x991B2028)
                                ),
                                border = BorderStroke(
                                    1.dp,
                                    if (selectedDay) accent.copy(alpha = .95f) else Color.White.copy(alpha = .18f)
                                ),
                                elevation = CardDefaults.cardElevation(
                                    defaultElevation = if (selectedDay) 6.dp else 3.dp
                                ),
                                shape = RoundedCornerShape(10.dp),
                                modifier = Modifier
                                    .weight(1f)
                                    .fillMaxHeight()
                                    .padding(2.dp)
                                    .clickable { onSelect(day) }
                            ) {
                                Column(
                                    Modifier.fillMaxSize().padding(vertical = 3.dp),
                                    horizontalAlignment = Alignment.CenterHorizontally,
                                    verticalArrangement = Arrangement.Center
                                ) {
                                    Text(
                                        "$number",
                                        color = Color.White,
                                        fontSize = 14.sp,
                                        fontWeight = FontWeight.Bold,
                                        lineHeight = 15.sp
                                    )
                                    Spacer(Modifier.height(2.dp))
                                    Row(
                                        horizontalArrangement = Arrangement.spacedBy(3.dp),
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        dayEvents.forEach { event ->
                                            when {
                                                isBirthdayEvent(event) -> Text("🌈", fontSize = 13.sp, lineHeight = 14.sp)
                                                event.memberId == ALL_FAMILY_MEMBER_ID -> Text(
                                                    "★",
                                                    color = Color(0xFFFFD75E),
                                                    fontSize = 15.sp,
                                                    lineHeight = 15.sp,
                                                    fontWeight = FontWeight.Bold
                                                )
                                                else -> {
                                                    val member = members.find { it.id == event.memberId }
                                                    val dotColor = member?.let { Color(it.colorArgb.toInt()) } ?: Color(0xFF8D95A5)
                                                    Box(Modifier.size(9.dp).clip(CircleShape).background(dotColor))
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git commit -m 'Replace MonthPanel with clean valid implementation'
          git push
