name: Apply running planned completion

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_running_complete_plan.py'
      - '.github/workflows/apply-running-complete-plan.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply planned run completion
        run: python3 scripts/apply_running_complete_plan.py
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          git commit -m "Complete planned runs without duplicates"
          git push
