name: Apply world-class member overview

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_worldclass_member_overview.py'
      - '.github/workflows/apply-worldclass-member-overview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply member overview
        run: python3 scripts/apply_worldclass_member_overview.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'Member overview already applied'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
            git commit -m 'Add world-class member overview'
            git push origin main
          fi
