name: Build Android APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify approved seasonal images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          expected = (
              "season_spring.webp",
              "season_summer.webp",
              "season_autumn.webp",
              "season_winter.webp",
          )

          root = Path("app/src/main/res/drawable-nodpi")
          errors = []

          for name in expected:
              path = root / name
              if not path.is_file():
                  errors.append(f"missing: {path}")
                  continue

              data = path.read_bytes()

              if len(data) < 100_000:
                  errors.append(f"image unexpectedly small: {name} ({len(data)} bytes)")

              if not (data.startswith(b"RIFF") and data[8:12] == b"WEBP"):
                  errors.append(f"not a valid WebP container: {name}")

          if errors:
              print("Season image verification FAILED")
              print("\n".join(errors))
              sys.exit(1)

          print("Season image verification OK: all four approved high-resolution WebP resources are present")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-current-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
