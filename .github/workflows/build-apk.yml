name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py

      - name: Verify Supabase client bootstrap
        run: |
          set -euo pipefail
          CONFIG="$(curl --fail --silent --show-error https://zigychfkpgypjuovgyqq.supabase.co/functions/v1/app-config)"
          KEY="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["apiKey"])' <<< "$CONFIG")"
          test -n "$KEY"
          STATUS="$(curl --silent --output /tmp/supabase-openapi.json --write-out '%{http_code}' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            https://zigychfkpgypjuovgyqq.supabase.co/rest/v1/)"
          echo "Supabase REST status: $STATUS"
          test "$STATUS" != "401"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-4.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render actual app screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant se.familjekalender.app android.permission.POST_NOTIFICATIONS || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb logcat -c
            adb shell am force-stop se.familjekalender.app
            adb shell am start -W -n se.familjekalender.app/.DesignPreviewActivity || true
            sleep 6
            adb shell input keyevent KEYCODE_BACK || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -W -n se.familjekalender.app/.DesignPreviewActivity || true
            sleep 2
            adb logcat -d -v threadtime > app-logcat.txt
            adb shell dumpsys activity top > activity-top.txt || true
            grep -q "se.familjekalender.app/.DesignPreviewActivity" activity-top.txt
            ! grep -q "FATAL EXCEPTION.*se.familjekalender.app" app-logcat.txt
            adb exec-out screencap -p > app-screen.png
            test -s app-screen.png

      - name: Upload rendered app screen
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-app-screen
          path: |
            app-screen.png
            app-logcat.txt
            activity-top.txt
