name: Apply grouped day overview and build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Group same-person activities
        run: python3 scripts/group_day_overview.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-grouped-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "No grouped day overview source change needed"
            exit 0
          fi
          git commit -m "Group day activities by family member"
          git push origin main
