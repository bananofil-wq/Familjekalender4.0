name: Apply live satellite location

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_live_satellite_location.py'
      - '.github/workflows/apply-live-satellite-location.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply live satellite patch
        run: python3 scripts/apply_live_satellite_location.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt app/src/main/java/se/familjekalender/app/FamilyLocationService.kt
          if git diff --cached --quiet; then
            echo "Already applied"
          else
            git commit -m "Add live satellite family location view"
            git push origin HEAD:main
          fi
