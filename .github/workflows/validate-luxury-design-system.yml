name: Validate Luxury Design System

on:
  push:
    branches: [ feature/luxury-design-system-20260916 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  luxury-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/luxury-design-system-20260916
      - name: Apply luxury design system
        run: python3 scripts/apply_luxury_design_system.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Persist validated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated source changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app
          git commit -m "Applicera enhetligt premiumtema i appen"
          git push
