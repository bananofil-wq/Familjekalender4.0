name: Apply theme button colors

on:
  push:
    paths:
      - '.build-trigger-theme-buttons'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply seasonal button colors
        run: python3 scripts/apply_theme_button_colors.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ToDoScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Make To-Do and shopping buttons follow seasonal theme"
          git push
