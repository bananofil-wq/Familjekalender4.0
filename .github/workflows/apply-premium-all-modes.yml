name: Apply Premium All Modes

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_premium_all_modes.py'
      - '.github/workflows/apply-premium-all-modes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply premium design to remaining modes
        run: python3 scripts/apply_premium_all_modes.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android build
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/se/familjekalender/app/MainActivity.kt \
            app/src/main/java/se/familjekalender/app/RunningLifeDashboard.kt \
            app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt
          if git diff --cached --quiet; then
            echo "Premium redesign already applied"
            exit 0
          fi
          git commit -m "Apply premium design to Full Sport and Personal modes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# v2 trigger
