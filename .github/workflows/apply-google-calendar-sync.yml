name: Apply Google Calendar sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-google-calendar-sync.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Google Calendar integration
        shell: python
        run: |
          from pathlib import Path

          # Android calendar permissions
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          anchor = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          perms = anchor + '    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n'
          if 'android.permission.READ_CALENDAR' not in s:
              if anchor not in s:
                  raise SystemExit('Manifest permission anchor not found')
              s = s.replace(anchor, perms, 1)
          p.write_text(s)

          # Supabase helper for Google Calendar upsert
          p = Path('app/src/main/java/se/familjekalender/app/SupabaseSync.kt')
          s = p.read_text()
          if 'suspend fun upsertExternalEvent(' not in s:
              anchor = '    suspend fun importSportAdmin(session: FamilySession, webcalUrl: String, memberId: String?): Int = withContext(Dispatchers.IO) {\n'
              helper = '''    suspend fun upsertExternalEvent(
        session: FamilySession,
        source: String,
        externalId: String,
        title: String,
        startsAt: ZonedDateTime,
        endsAt: ZonedDateTime?,
        memberId: String?
    ) = withContext(Dispatchers.IO) {
        val body = JSONObject()
            .put("family_id", session.id)
            .put("title", title)
            .put("starts_at", startsAt.toOffsetDateTime().toString())
            .put("source", source)
            .put("external_id", externalId)
            .put("updated_at", OffsetDateTime.now().toString())
        if (endsAt != null && endsAt.isAfter(startsAt)) body.put("ends_at", endsAt.toOffsetDateTime().toString())
        if (memberId == null || memberId == ALL_FAMILY_MEMBER_ID) body.put("member_id", JSONObject.NULL) else body.put("member_id", memberId)
        request(
            "POST",
            "/rest/v1/calendar_events?on_conflict=family_id,source,external_id",
            body,
            session.code,
            preferRepresentation = false,
            preferExtra = "resolution=merge-duplicates"
        )
    }

'''
              if anchor not in s:
                  raise SystemExit('Supabase importSportAdmin anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          # Add settings card to Settings screen
          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          if 'GoogleCalendarSettingsCard(session)' not in s:
              anchor = '    Spacer(Modifier.height(14.dp))\n    MailSettingsCard(session)\n'
              replacement = '    Spacer(Modifier.height(14.dp))\n    GoogleCalendarSettingsCard(session)\n    Spacer(Modifier.height(14.dp))\n    MailSettingsCard(session)\n'
              if anchor not in s:
                  raise SystemExit('Settings MailSettingsCard anchor not found')
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/AndroidManifest.xml app/src/main/java/se/familjekalender/app/SupabaseSync.kt app/src/main/java/se/familjekalender/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Koppla Google Kalender till Familjekalendern"
            git push
          fi
