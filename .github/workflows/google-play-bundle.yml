name: Google Play Release Bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Google Play versionCode"
        required: true
        default: "5"
      version_name:
        description: "Version name"
        required: true
        default: "4.4.0"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore Play upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILJEKALENDER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing FAMILJEKALENDER_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/familjekalender-upload.jks"

      - name: Build signed release AAB
        env:
          FAMILJEKALENDER_VERSION_CODE: ${{ inputs.version_code }}
          FAMILJEKALENDER_VERSION_NAME: ${{ inputs.version_name }}
          FAMILJEKALENDER_KEYSTORE_PATH: ${{ runner.temp }}/familjekalender-upload.jks
          FAMILJEKALENDER_KEYSTORE_PASSWORD: ${{ secrets.FAMILJEKALENDER_KEYSTORE_PASSWORD }}
          FAMILJEKALENDER_KEY_ALIAS: ${{ secrets.FAMILJEKALENDER_KEY_ALIAS }}
          FAMILJEKALENDER_KEY_PASSWORD: ${{ secrets.FAMILJEKALENDER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-Google-Play-AAB-${{ inputs.version_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
