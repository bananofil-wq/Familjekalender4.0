name: Apply readable running entries

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_readable_running_entries.py'
      - '.github/workflows/apply-readable-running-entries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_readable_running_entries.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make running entries readable"
            git push
          fi
