name: Validate roadmap branch

on:
  workflow_dispatch:
  push:
    branches: [ feature/family-assistant-phase2 ]
    paths:
      - 'app/**'
      - 'scripts/verify-season-images.py'
      - '.github/workflows/validate-roadmap-branch.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py
      - name: Compile debug APK and validate roadmap changes
        run: gradle :app:assembleDebug --stacktrace
