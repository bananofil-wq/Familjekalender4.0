name: Apply calendar enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix calendar position and cleanup entry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cal = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = cal.read_text()

          # Keep background/layout untouched. Move only the month/date card farther up
          # so the complete calendar is visible above the bottom navigation.
          if '.offset(y = (-38).dp)' in s:
              s = s.replace('.offset(y = (-38).dp)', '.offset(y = (-92).dp)', 1)
          elif '.offset(y = (-92).dp)' not in s:
              raise SystemExit('Calendar month panel offset not found')

          # Expose the already implemented month-cleanup dialog from the add menu.
          anchor = '''                    Button(\n                        onClick = {\n                            showAddMenu = false\n                            onAddLaundry()\n                        },\n                        modifier = Modifier.fillMaxWidth()\n                    ) { Text("🧺 Tvätt") }'''
          replacement = anchor + '''\n                    OutlinedButton(\n                        onClick = {\n                            showAddMenu = false\n                            showManageMonth = true\n                        },\n                        modifier = Modifier.fillMaxWidth(),\n                        colors = ButtonDefaults.outlinedButtonColors(contentColor = MaterialTheme.colorScheme.error)\n                    ) { Text("Hantera / rensa kalender") }'''
          if 'Text("Hantera / rensa kalender")' not in s:
              if anchor in s:
                  s = s.replace(anchor, replacement, 1)
              else:
                  raise SystemExit('Add-menu anchor not found')

          cal.write_text(s)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git commit -m "Fix calendar visibility and add cleanup entry"
          git push
