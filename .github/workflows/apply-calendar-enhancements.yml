name: Apply calendar enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Move calendar viewport upward
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          anchor = 'FamilyAssistantCard(session, events, members, shopping) { assistantAddRequest++ }'
          pos = s.index(anchor)
          before = s[:pos]
          after = s[pos:]
          old = '.height(590.dp)'
          new = '.offset(y = (-38).dp)\n                            .height(590.dp)'
          if '.offset(y = (-38).dp)' in after:
              print('Calendar already shifted upward')
          elif old in after:
              after = after.replace(old, new, 1)
              p.write_text(before + after)
          else:
              raise SystemExit('Calendar height marker not found')
          PY
      - name: Keep rotating work week editor scrollable
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()
          marker = 'title = { Text("Redigera vecka ${index + 1}", fontWeight = FontWeight.Bold) },'
          pos = s.index(marker)
          before = s[:pos]
          after = s[pos:]
          old = 'Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {'
          new = 'Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(10.dp)) {'
          if old in after:
              after = after.replace(old, new, 1)
              p.write_text(before + after)
          elif new not in after:
              raise SystemExit('Rotation editor column not found')
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git commit -m "Move calendar viewport upward"
          git push
