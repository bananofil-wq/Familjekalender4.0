# Verified: only the date/month panel is shifted upward; background and assistant remain unchanged.
name: Apply calendar enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Move only the month panel upward
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = main.read_text()
          old = '''                            .fillMaxWidth()\n                            .offset(y = (-38).dp)\n                            .height(590.dp)'''
          new = '''                            .fillMaxWidth()\n                            .height(590.dp)'''
          if old in s:
              s = s.replace(old, new, 1)
              main.write_text(s)
          elif '.offset(y = (-38).dp)' in s:
              raise SystemExit('Unexpected -38dp offset remains in MainActivity')

          cal = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = cal.read_text()
          anchor = '''            BoxWithConstraints(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .weight(1f)'''
          replacement = '''            BoxWithConstraints(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .offset(y = (-38).dp)\n                    .weight(1f)'''
          if replacement in s:
              print('Month panel already shifted upward')
          elif anchor in s:
              s = s.replace(anchor, replacement, 1)
              cal.write_text(s)
          else:
              raise SystemExit('Month panel anchor not found')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git commit -m "Move only calendar date panel upward"
          git push
