name: Apply calendar enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Kotlin sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()
          s = s.replace('import android.app.TimePickerDialog\n', 'import android.app.TimePickerDialog\nimport androidx.compose.animation.core.Animatable\nimport androidx.compose.animation.core.tween\n') if 'Animatable' not in s else s
          s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.graphicsLayer\n') if 'graphicsLayer' not in s else s
          s = s.replace('import java.time.format.TextStyle\n', 'import java.time.format.TextStyle\nimport java.time.temporal.WeekFields\n') if 'WeekFields' not in s else s
          s = s.replace('import java.util.Locale\n', 'import java.util.Locale\nimport kotlin.math.abs\n') if 'kotlin.math.abs' not in s else s
          s = s.replace('    val mode = palette.mode\n', '    val mode = palette.mode\n    val monthDrag = remember { Animatable(0f) }\n') if 'val monthDrag =' not in s else s
          s = s.replace('    val monthName = month.month.getDisplayName(TextStyle.FULL, Locale("sv", "SE")).replaceFirstChar { it.uppercase() }\n', '    val monthName = month.month.getDisplayName(TextStyle.FULL, Locale("sv", "SE")).replaceFirstChar { it.uppercase() }\n    val weekFields = WeekFields.of(Locale("sv", "SE"))\n') if 'val weekFields =' not in s else s
          if 'Text("v",' not in s:
              s = s.replace('            Row(Modifier.fillMaxWidth()) {\n                listOf("Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön").forEach {', '            Row(Modifier.fillMaxWidth()) {\n                Text("v", color = Color.White.copy(alpha = .55f), fontSize = 8.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center, modifier = Modifier.width(18.dp))\n                listOf("Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön").forEach {')
          if 'val weekNumber =' not in s:
              s = re.sub(r'(\s*)repeat\(6\) \{ week ->\n\s*Row\(Modifier\.fillMaxWidth\(\)\.weight\(1f\)\) \{', lambda m: m.group(0).replace('Row(Modifier.fillMaxWidth().weight(1f)) {', 'val rowMonday = month.atDay(1).minusDays(offset.toLong()).plusWeeks(week.toLong())\n                val weekNumber = rowMonday.get(weekFields.weekOfWeekBasedYear())\n                Row(Modifier.fillMaxWidth().weight(1f)) {\n                    Text("$weekNumber", color = Color.White.copy(alpha = .58f), fontSize = 8.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center, modifier = Modifier.width(18.dp).align(Alignment.CenterVertically))'), s, count=1)
          if 'val todayDay = day == LocalDate.now()' not in s:
              s = s.replace('                        val selectedDay = day == selected\n', '                        val selectedDay = day == selected\n                        val todayDay = day == LocalDate.now()\n')
          s = s.replace('containerColor = if (day == null) Color.Transparent else if (selectedDay) accent.copy(alpha = .88f) else Color(0x991B2028)', 'containerColor = when { day == null -> Color.Transparent; selectedDay -> accent.copy(alpha = .88f); todayDay -> accent.copy(alpha = .42f); else -> Color(0x991B2028) }')
          s = s.replace('1.dp,\n                                if (selectedDay) accent.copy(alpha = .95f) else Color.White.copy(alpha = .18f)', 'if (todayDay && !selectedDay) 2.dp else 1.dp,\n                                when { selectedDay -> accent.copy(alpha = .95f); todayDay -> accent; else -> Color.White.copy(alpha = .18f) }')
          if '.graphicsLayer { translationX = monthDrag.value }' not in s:
              s = s.replace('''                    .weight(1.72f)
                    .pointerInput(month) {
                        var drag = 0f
                        detectHorizontalDragGestures(
                            onDragStart = { drag = 0f },
                            onHorizontalDrag = { _, amount -> drag += amount },
                            onDragEnd = {
                                when {
                                    drag <= -70f -> moveMonth(1)
                                    drag >= 70f -> moveMonth(-1)
                                }
                                drag = 0f
                            },
                            onDragCancel = { drag = 0f }
                        )
                    }''', '''                    .weight(1.72f)
                    .graphicsLayer { translationX = monthDrag.value }
                    .pointerInput(month) {
                        detectHorizontalDragGestures(
                            onDragStart = { launch { monthDrag.stop() } },
                            onHorizontalDrag = { change, amount -> change.consume(); launch { monthDrag.snapTo(monthDrag.value + amount) } },
                            onDragEnd = {
                                launch {
                                    val width = size.width.toFloat().coerceAtLeast(1f)
                                    if (abs(monthDrag.value) >= width * .18f) {
                                        val direction = if (monthDrag.value < 0f) -1f else 1f
                                        monthDrag.animateTo(direction * width, tween(130))
                                        moveMonth(if (direction < 0f) 1 else -1)
                                        monthDrag.snapTo(-direction * width)
                                        monthDrag.animateTo(0f, tween(190))
                                    } else monthDrag.animateTo(0f, tween(160))
                                }
                            },
                            onDragCancel = { launch { monthDrag.animateTo(0f, tween(160)) } }
                        )
                    }''')
          p.write_text(s)

          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('AddEventDialog(members, selectedDate, { showAddEvent = false }) { title, startTime, endTime, memberId, dates, birthday ->', 'AddEventDialog(members, selectedDate, { showAddEvent = false }) { title, startTime, endTime, memberId, dates, birthday, recurrence ->')
          s = s.replace('''                } else {
                    dates.sorted().forEach { date ->
                        SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId)
                    }
                }''', '''                } else {
                    val targetDates = if (recurrence == RecurrenceMode.NONE) dates.sorted() else dates.sorted().flatMap { recurringDates(it, recurrence) }.distinct().sorted()
                    targetDates.forEach { date -> SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId) }
                }''')
          s = s.replace('onAdd: (String, String, String, String?, List<LocalDate>, Boolean) -> Unit', 'onAdd: (String, String, String, String?, List<LocalDate>, Boolean, RecurrenceMode) -> Unit')
          if 'var recurrence by remember' not in s:
              s = s.replace('    var isBirthday by remember { mutableStateOf(false) }\n', '    var isBirthday by remember { mutableStateOf(false) }\n    var recurrence by remember { mutableStateOf(RecurrenceMode.NONE) }\n')
          s = s.replace('isBirthday = !isBirthday\n                        if (isBirthday &&', 'isBirthday = !isBirthday\n                        if (isBirthday) recurrence = RecurrenceMode.NONE\n                        if (isBirthday &&')
          s = s.replace('isBirthday = checked\n                        if (checked &&', 'isBirthday = checked\n                        if (checked) recurrence = RecurrenceMode.NONE\n                        if (checked &&')
          marker = '                    Text("Födelsedag – upprepas varje år")\n                }\n\n                OutlinedTextField('
          if 'Text("Upprepning"' not in s:
              insert = '                    Text("Födelsedag – upprepas varje år")\n                }\n\n                if (!isBirthday) {\n                    Spacer(Modifier.height(6.dp))\n                    Text("Upprepning", fontWeight = FontWeight.Bold)\n                    RecurrenceMode.values().forEach { mode ->\n                        Row(Modifier.fillMaxWidth().clickable { recurrence = mode }, verticalAlignment = Alignment.CenterVertically) {\n                            RadioButton(selected = recurrence == mode, onClick = { recurrence = mode })\n                            Text(mode.label)\n                        }\n                    }\n                }\n\n                OutlinedTextField('
              s = s.replace(marker, insert)
          s = s.replace('onAdd(title.trim(), startTime, endTime, memberId, dates.toList(), isBirthday)', 'onAdd(title.trim(), startTime, endTime, memberId, dates.toList(), isBirthday, recurrence)')
          p.write_text(s)
          PY
      - name: Verify source markers
        run: |
          grep -q 'val weekNumber' app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          grep -q 'todayDay' app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          grep -q 'graphicsLayer { translationX = monthDrag.value }' app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          grep -q 'Text("Upprepning"' app/src/main/java/se/familjekalender/app/MainActivity.kt
      - name: Commit Kotlin changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt app/src/main/java/se/familjekalender/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Implement calendar week numbers recurrence and swipe"
          git push
