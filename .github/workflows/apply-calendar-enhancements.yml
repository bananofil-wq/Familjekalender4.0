name: Apply calendar enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Kotlin sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          exact = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = exact.read_text()
          if 'java.time.temporal.WeekFields' not in s:
              s = s.replace('import java.time.format.TextStyle\n', 'import java.time.format.TextStyle\nimport java.time.temporal.WeekFields\n')
          if 'androidx.compose.animation.core.Animatable' not in s:
              s = s.replace('import android.app.TimePickerDialog\n', 'import android.app.TimePickerDialog\nimport androidx.compose.animation.core.Animatable\nimport androidx.compose.animation.core.tween\n')
          if 'androidx.compose.ui.graphics.graphicsLayer' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.graphicsLayer\n')
          if 'kotlin.math.abs' not in s:
              s = s.replace('import java.util.Locale\n', 'import java.util.Locale\nimport kotlin.math.abs\n')
          if 'val monthDrag = remember { Animatable(0f) }' not in s:
              s = s.replace('    val mode = palette.mode\n    val date = if (YearMonth.from(selectedDate) == month) selectedDate else month.atDay(1)', '    val mode = palette.mode\n    val monthDrag = remember { Animatable(0f) }\n    val date = if (YearMonth.from(selectedDate) == month) selectedDate else month.atDay(1)')
          if 'val weekFields = WeekFields.of' not in s:
              s = s.replace('    val monthName = month.month.getDisplayName(TextStyle.FULL, Locale("sv", "SE")).replaceFirstChar { it.uppercase() }\n', '    val monthName = month.month.getDisplayName(TextStyle.FULL, Locale("sv", "SE")).replaceFirstChar { it.uppercase() }\n    val weekFields = WeekFields.of(Locale("sv", "SE"))\n')
          if 'modifier = Modifier.width(18.dp)' not in s:
              s = s.replace('''            Row(Modifier.fillMaxWidth()) {
                listOf("Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön").forEach {''', '''            Row(Modifier.fillMaxWidth()) {
                Text("v", color = Color(0xFF8F929A), fontSize = 8.sp, fontWeight = FontWeight.SemiBold, textAlign = TextAlign.Center, modifier = Modifier.width(18.dp))
                listOf("Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön").forEach {''')
          if 'val rowMonday =' not in s:
              s = s.replace('''            repeat(6) { week ->
                Row(Modifier.fillMaxWidth().weight(1f)) {
                    repeat(7) { column ->''', '''            repeat(6) { week ->
                val rowMonday = month.atDay(1).minusDays(offset.toLong()).plusWeeks(week.toLong())
                val weekNumber = rowMonday.get(weekFields.weekOfWeekBasedYear())
                Row(Modifier.fillMaxWidth().weight(1f)) {
                    Text("$weekNumber", color = Color.White.copy(alpha = .58f), fontSize = 8.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center, modifier = Modifier.width(18.dp).align(Alignment.CenterVertically))
                    repeat(7) { column ->''')
          if 'val todayDay = day == LocalDate.now()' not in s:
              s = s.replace('''                        val selectedDay = day == selected
                        val dayEvents''', '''                        val selectedDay = day == selected
                        val todayDay = day == LocalDate.now()
                        val dayEvents''')
          s = s.replace('''                                containerColor = if (day == null) Color.Transparent else if (selectedDay) accent.copy(alpha = .88f) else Color(0x991B2028)
                            ),
                            border = if (day == null) null else BorderStroke(
                                1.dp,
                                if (selectedDay) accent.copy(alpha = .95f) else Color.White.copy(alpha = .18f)
                            ),''', '''                                containerColor = when {
                                    day == null -> Color.Transparent
                                    selectedDay -> accent.copy(alpha = .88f)
                                    todayDay -> accent.copy(alpha = .42f)
                                    else -> Color(0x991B2028)
                                }
                            ),
                            border = if (day == null) null else BorderStroke(
                                if (todayDay && !selectedDay) 2.dp else 1.dp,
                                when {
                                    selectedDay -> accent.copy(alpha = .95f)
                                    todayDay -> accent
                                    else -> Color.White.copy(alpha = .18f)
                                }
                            ),''')
          old = '''                modifier = Modifier
                    .fillMaxWidth()
                    .weight(1.72f)
                    .pointerInput(month) {
                        var drag = 0f
                        detectHorizontalDragGestures(
                            onDragStart = { drag = 0f },
                            onHorizontalDrag = { _, amount -> drag += amount },
                            onDragEnd = {
                                when {
                                    drag <= -70f -> moveMonth(1)
                                    drag >= 70f -> moveMonth(-1)
                                }
                                drag = 0f
                            },
                            onDragCancel = { drag = 0f }
                        )
                    }'''
          new = '''                modifier = Modifier
                    .fillMaxWidth()
                    .weight(1.72f)
                    .graphicsLayer { translationX = monthDrag.value }
                    .pointerInput(month) {
                        detectHorizontalDragGestures(
                            onDragStart = { launch { monthDrag.stop() } },
                            onHorizontalDrag = { change, amount ->
                                change.consume()
                                launch { monthDrag.snapTo(monthDrag.value + amount) }
                            },
                            onDragEnd = {
                                launch {
                                    val width = size.width.toFloat().coerceAtLeast(1f)
                                    val threshold = width * 0.18f
                                    if (abs(monthDrag.value) >= threshold) {
                                        val direction = if (monthDrag.value < 0f) -1f else 1f
                                        monthDrag.animateTo(direction * width, tween(130))
                                        moveMonth(if (direction < 0f) 1 else -1)
                                        monthDrag.snapTo(-direction * width)
                                        monthDrag.animateTo(0f, tween(190))
                                    } else monthDrag.animateTo(0f, tween(160))
                                }
                            },
                            onDragCancel = { launch { monthDrag.animateTo(0f, tween(160)) } }
                        )
                    }'''
          if old in s:
              s = s.replace(old, new)
          exact.write_text(s)

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = main.read_text()
          s = s.replace('AddEventDialog(members, selectedDate, { showAddEvent = false }) { title, startTime, endTime, memberId, dates, birthday ->', 'AddEventDialog(members, selectedDate, { showAddEvent = false }) { title, startTime, endTime, memberId, dates, birthday, recurrence ->')
          s = s.replace('''                } else {
                    dates.sorted().forEach { date ->
                        SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId)
                    }
                }
                refresh()''', '''                } else {
                    val targetDates = if (recurrence == RecurrenceMode.NONE) dates.sorted() else dates.sorted().flatMap { recurringDates(it, recurrence) }.distinct().sorted()
                    targetDates.forEach { date -> SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId) }
                }
                refresh()''')
          s = s.replace('onAdd: (String, String, String, String?, List<LocalDate>, Boolean) -> Unit', 'onAdd: (String, String, String, String?, List<LocalDate>, Boolean, RecurrenceMode) -> Unit')
          if 'var recurrence by remember' not in s:
              s = s.replace('    var isBirthday by remember { mutableStateOf(false) }\n', '    var isBirthday by remember { mutableStateOf(false) }\n    var recurrence by remember { mutableStateOf(RecurrenceMode.NONE) }\n')
          s = s.replace('''                        isBirthday = !isBirthday
                        if (isBirthday && dates.size > 1) {''', '''                        isBirthday = !isBirthday
                        if (isBirthday) recurrence = RecurrenceMode.NONE
                        if (isBirthday && dates.size > 1) {''')
          s = s.replace('''                        isBirthday = checked
                        if (checked && dates.size > 1) {''', '''                        isBirthday = checked
                        if (checked) recurrence = RecurrenceMode.NONE
                        if (checked && dates.size > 1) {''')
          marker = '''                    Text("Födelsedag – upprepas varje år")
                }

                OutlinedTextField('''
          if marker in s and 'Text("Upprepning"' not in s:
              s = s.replace(marker, '''                    Text("Födelsedag – upprepas varje år")
                }

                if (!isBirthday) {
                    Spacer(Modifier.height(6.dp))
                    Text("Upprepning", fontWeight = FontWeight.Bold)
                    RecurrenceMode.values().forEach { mode ->
                        Row(Modifier.fillMaxWidth().clickable { recurrence = mode }, verticalAlignment = Alignment.CenterVertically) {
                            RadioButton(selected = recurrence == mode, onClick = { recurrence = mode })
                            Text(mode.label)
                        }
                    }
                }

                OutlinedTextField(''')
          s = s.replace('onAdd(title.trim(), startTime, endTime, memberId, dates.toList(), isBirthday)', 'onAdd(title.trim(), startTime, endTime, memberId, dates.toList(), isBirthday, recurrence)')
          main.write_text(s)
          PY
      - name: Verify source markers
        run: |
          grep -q 'val weekNumber' app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          grep -q 'todayDay' app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          grep -q 'monthDrag' app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          grep -q 'RecurrenceMode' app/src/main/java/se/familjekalender/app/MainActivity.kt
      - name: Commit Kotlin changes
        run: |
          if git diff --quiet; then
            echo "Kotlin sources already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m "Implement calendar week numbers recurrence and swipe"
          git push
