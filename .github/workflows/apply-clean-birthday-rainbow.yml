name: Apply clean birthday rainbow

on:
  push:
    paths:
      - '.build-trigger-clean-rainbow'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rainbow patch
        run: python3 scripts/apply_clean_birthday_rainbow.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git commit -m "Use clean drawn birthday rainbow"
          git push
