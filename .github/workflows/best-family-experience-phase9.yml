name: Best family experience phase 9

on:
  workflow_dispatch:
  push:
    branches: [ feature/best-family-experience ]
    paths:
      - 'scripts/apply_series_split_semantics.py'
      - '.github/workflows/best-family-experience-phase9.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/best-family-experience
      - name: Apply series split semantics
        run: python3 scripts/apply_series_split_semantics.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/se/familjekalender/app/SupabaseSync.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
            git commit -m 'Split recurring series safely when editing'
            git push origin HEAD:feature/best-family-experience
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
