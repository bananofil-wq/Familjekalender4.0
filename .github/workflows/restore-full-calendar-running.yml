name: Restore full calendar and running history

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-full-calendar-running.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply restoration patch
        run: python3 scripts/restore_full_calendar_running.py

      - name: Persist restored modes and running history
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Restoration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/RunRecorderPanel.kt
          git commit -m "Restore Fullständigt and GPS replay history"
          git push origin HEAD:main
