name: Fix workmonth end times

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/fix_workmonth_end_times.py'
      - '.github/workflows/fix-workmonth-end-times.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Preserve workmonth durations
        run: python scripts/fix_workmonth_end_times.py
      - name: Commit workmonth duration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/CalendarBuildCompat.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git diff --cached --quiet || git commit -m "Persist workmonth end times"
          git push
