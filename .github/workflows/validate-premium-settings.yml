name: Validate Premium Settings

on:
  push:
    branches: [ feature/premium-settings-20260916 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/premium-settings-20260916
      - name: Apply premium settings
        run: |
          python3 scripts/apply_premium_settings.py
          python3 scripts/fix_premium_settings_imports.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Persist validated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app
          git commit -m "Applicera premiumdesign på inställningar"
          git push
