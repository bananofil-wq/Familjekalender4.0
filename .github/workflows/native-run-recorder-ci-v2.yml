name: Native Run Recorder Build V2

on:
  push:
    branches:
      - feature/native-run-recorder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-recorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-run-recorder
          fetch-depth: 0

      - name: Integrate recorder panel into running screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/se/familjekalender/app/RunningProgressCard.kt')
          s = p.read_text()
          if 'RunRecorderPanel(' not in s:
              stat_anchor = 'RunStat("Senast", latest?.let'
              stat_pos = s.find(stat_anchor)
              if stat_pos < 0:
                  raise SystemExit('Could not find Senast run stat')
              spacer = '                Spacer(Modifier.height(10.dp))'
              insert_at = s.rfind(spacer, 0, stat_pos)
              if insert_at < 0:
                  raise SystemExit('Could not find insertion point')
              panel = (
                  '                selectedMemberId?.let { memberId ->\n'
                  '                    Spacer(Modifier.height(12.dp))\n'
                  '                    RunRecorderPanel(\n'
                  '                        session = session,\n'
                  '                        memberId = memberId,\n'
                  '                        onChanged = onChanged\n'
                  '                    )\n'
                  '                }\n\n'
              )
              p.write_text(s[:insert_at] + panel + s[insert_at:])
          PY

      - name: Persist recorder UI integration
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/se/familjekalender/app/RunningProgressCard.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
            git commit -m "Integrate native GPS recorder into running screen"
            git push origin HEAD:feature/native-run-recorder
          fi

      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-native-run-recorder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
