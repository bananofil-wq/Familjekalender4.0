name: Apply running personal best v3

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_running_pb_v3.py'
      - '.github/workflows/apply-running-pb-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply running personal best patch
        run: python3 scripts/apply_running_pb_v3.py
      - name: Commit source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          git diff --cached --quiet || git commit -m 'Add running personal best insights'
          git push
