name: Apply running month and streak v4

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_running_month_streak_v4.py'
      - '.github/workflows/apply-running-month-streak-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply running month and streak patch
        run: python3 scripts/apply_running_month_streak_v4.py
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          git diff --cached --quiet || git commit -m "Add running month and continuity insights"
          git push
