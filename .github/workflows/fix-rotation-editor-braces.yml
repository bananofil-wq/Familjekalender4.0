name: Fix rotation editor compile error

on:
  push:
    paths:
      - 'scripts/fix_rotation_editor_braces.py'
      - '.github/workflows/fix-rotation-editor-braces.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix source
        run: python3 scripts/fix_rotation_editor_braces.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix rotation editor compile error"
            git push
          fi
