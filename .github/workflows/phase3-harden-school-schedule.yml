name: Phase 3 harden school schedule

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/phase3_harden_school_schedule.py'
      - '.github/workflows/phase3-harden-school-schedule.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Harden school schedule
        run: python scripts/phase3_harden_school_schedule.py
      - name: Commit school schedule changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/SchoolScheduleDialog.kt
          git diff --cached --quiet || git commit -m "Harden school and preschool scheduling"
          git push
