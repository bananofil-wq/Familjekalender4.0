name: Apply family location tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-family-location-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app navigation and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          if 'import androidx.compose.material.icons.filled.LocationOn' not in s:
              s = s.replace('import androidx.compose.material.icons.filled.ContentCopy\n', 'import androidx.compose.material.icons.filled.ContentCopy\nimport androidx.compose.material.icons.filled.LocationOn\n')
          old = '''                        4 -> SettingsScreen(session, members.filter { it.id != ALL_FAMILY_MEMBER_ID }, sportUrl, themeMode, onThemeModeSaved, onSportUrlSaved) { url, memberId ->
                            scope.launch {
                                message = "Importerar SportAdmin…"
                                runCatching { SupabaseSync.importSportAdmin(session, url, memberId) }
                                    .onSuccess { message = "$it SportAdmin-aktiviteter synkade" }
                                    .onFailure { message = "SportAdmin-fel: ${it.message}" }
                                refresh()
                            }
                        }
'''
          new = old + '''                        5 -> FamilyLocationScreen(session, members.filter { it.id != ALL_FAMILY_MEMBER_ID })
'''
          if '5 -> FamilyLocationScreen' not in s:
              if old not in s:
                  raise SystemExit('Settings tab block not found')
              s = s.replace(old, new)
          old_nav = '''            Icons.Default.People to "Familj",
            Icons.Default.Settings to "Inställningar"
'''
          new_nav = '''            Icons.Default.People to "Familj",
            Icons.Default.Settings to "Inställningar",
            Icons.Default.LocationOn to "Plats"
'''
          if 'Icons.Default.LocationOn to "Plats"' not in s:
              if old_nav not in s:
                  raise SystemExit('Bottom nav block not found')
              s = s.replace(old_nav, new_nav)
          p.write_text(s)

          p = Path('app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.rememberScrollState\n', '')
          s = s.replace('import androidx.compose.foundation.verticalScroll\n', '')
          s = s.replace('''        Modifier
            .fillMaxSize()
            .verticalScroll(rememberScrollState())
            .padding(18.dp),''', '''        Modifier
            .fillMaxWidth(),''')
          p.write_text(s)

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          addition = marker + '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              if marker not in s:
                  raise SystemExit('Manifest permission marker not found')
              s = s.replace(marker, addition)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "bananofil-wq"
          git config user.email "bananofil@gmail.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add family location tab beside settings"
            git push
          fi
