name: Apply modular personal layouts

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt'
      - 'scripts/apply_personal_layout_mode.py'
      - '.github/workflows/apply-personal-layout-mode.yml'
      - 'build-triggers/personal-layout-20260915.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply personal layout integration
        run: python3 scripts/apply_personal_layout_mode.py

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m "Add persistent modular personal layouts"
          git push
