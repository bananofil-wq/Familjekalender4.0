name: Phase 2 edit event end time

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/phase2-edit-event-end-time.py'
      - '.github/workflows/phase2-edit-event-end-time.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Add end-time editing
        run: python scripts/phase2-edit-event-end-time.py
      - name: Commit end-time editing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt app/src/main/java/se/familjekalender/app/SupabaseSync.kt
          git diff --cached --quiet || git commit -m "Support editing event end times"
          git push
