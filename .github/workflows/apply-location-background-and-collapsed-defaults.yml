name: Apply location reliability and collapsed defaults

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-location-background-and-collapsed-defaults.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch collapsed defaults and background location
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          assistant = Path('app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt')
          for label, old, new in [
              ('today collapsed default', 'var todayPlanExpanded by remember { mutableStateOf(true) }', 'var todayPlanExpanded by remember { mutableStateOf(false) }'),
              ('week collapsed default', 'var weekExpanded by remember { mutableStateOf(true) }', 'var weekExpanded by remember { mutableStateOf(false) }'),
              ('autopilot collapsed default', 'var autopilotExpanded by remember { mutableStateOf(true) }', 'var autopilotExpanded by remember { mutableStateOf(false) }'),
          ]:
              replace_once(assistant, old, new, label)

          location = Path('app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt')
          replace_once(
              location,
              '''        return listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)\n            .mapNotNull { provider -> runCatching { manager.getLastKnownLocation(provider) }.getOrNull() }\n            .maxByOrNull { it.time }''',
              '''        return listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)\n            .mapNotNull { provider -> runCatching { manager.getLastKnownLocation(provider) }.getOrNull() }\n            .maxByOrNull { it.time }\n            ?.takeIf { last -> System.currentTimeMillis() - last.time <= 2 * 60_000L }''',
              'reject stale cached location'
          )
          replace_once(
              location,
              '''            status = "Platsdelning aktiverad"\n            scope.launch { publishNow() }''',
              '''            status = "Platsdelning aktiverad"\n            FamilyLocationService.start(context)\n            scope.launch { publishNow() }''',
              'start service after permission'
          )
          replace_once(
              location,
              '''        status = "Platsdelning aktiverad"\n        scope.launch { publishNow() }''',
              '''        status = "Platsdelning aktiverad"\n        FamilyLocationService.start(context)\n        scope.launch { publishNow() }''',
              'start service when sharing'
          )
          replace_once(
              location,
              '''        status = "Platsdelning pausad"\n        selectedMemberId?.let { id ->''',
              '''        status = "Platsdelning pausad"\n        FamilyLocationService.stop(context)\n        selectedMemberId?.let { id ->''',
              'stop service when sharing stops'
          )
          replace_once(
              location,
              '''                                    status = "Den här telefonen är kopplad till ${member.name}"\n                                    if (shouldEnable) startSharing()''',
              '''                                    status = "Den här telefonen är kopplad till ${member.name}"\n                                    if (shouldEnable) startSharing() else if (sharing) FamilyLocationService.start(context)''',
              'refresh service member identity'
          )
          replace_once(
              location,
              '''    LaunchedEffect(session.id, sharing, selectedMemberId) {\n        refresh()\n        while (true) {\n            if (sharing && selectedMemberId != null && hasLocationPermission()) {\n                publishNow()\n            } else {\n                refresh()\n            }\n            checkLocationTransitions(context, session.id, locations, places, familyMembers)\n            delay(30_000)\n        }\n    }''',
              '''    LaunchedEffect(session.id, sharing, selectedMemberId) {\n        if (sharing && selectedMemberId != null && hasLocationPermission()) {\n            FamilyLocationService.start(context)\n        }\n        while (true) {\n            refresh()\n            checkLocationTransitions(context, session.id, locations, places, familyMembers)\n            delay(15_000)\n        }\n    }''',
              'screen refresh loop'
          )
          replace_once(
              location,
              '''                    if (sharing) "Syns för familjens medlemmar" else "Avstängd"''',
              '''                    if (sharing) "Aktiv även när appen ligger i bakgrunden" else "Avstängd"''',
              'background sharing subtitle'
          )
          replace_once(location, 'private fun checkLocationTransitions(', 'internal fun checkLocationTransitions(', 'expose transition checker')

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          replace_once(
              main,
              '''class MainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContent { ResponsiveApp { FamilyCalendarApp() } }\n    }\n}''',
              '''class MainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContent { ResponsiveApp { FamilyCalendarApp() } }\n    }\n\n    override fun onStart() {\n        super.onStart()\n        val locationPrefs = getSharedPreferences("family_calendar_location", MODE_PRIVATE)\n        if (locationPrefs.getBoolean("sharing_enabled", false) &&\n            !locationPrefs.getString("device_member_id", null).isNullOrBlank()\n        ) {\n            FamilyLocationService.start(this)\n        }\n    }\n}''',
              'resume location service on app start'
          )

          manifest = Path('app/src/main/AndroidManifest.xml')
          replace_once(
              manifest,
              '''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />''',
              '''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />''',
              'foreground location permissions'
          )
          replace_once(
              manifest,
              '''        <provider\n            android:name="androidx.core.content.FileProvider"''',
              '''        <service\n            android:name=".FamilyLocationService"\n            android:exported="false"\n            android:foregroundServiceType="location" />\n\n        <provider\n            android:name="androidx.core.content.FileProvider"''',
              'register location service'
          )
          PY

          cat > app/src/main/java/se/familjekalender/app/FamilyLocationService.kt <<'KOTLIN'
          package se.familjekalender.app

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          class FamilyLocationService : Service() {
              companion object {
                  private const val CHANNEL_ID = "family_location_tracking"
                  private const val NOTIFICATION_ID = 73041
                  private const val LOCATION_PREFS = "family_calendar_location"
                  private const val FAMILY_PREFS = "family_calendar"
                  private const val MIN_PUBLISH_INTERVAL_MS = 120_000L
                  private const val MIN_PUBLISH_DISTANCE_M = 20f
                  private const val MAX_ACCEPTED_ACCURACY_M = 250f

                  fun start(context: Context) {
                      val intent = Intent(context, FamilyLocationService::class.java)
                      runCatching {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              ContextCompat.startForegroundService(context, intent)
                          } else {
                              context.startService(intent)
                          }
                      }
                  }

                  fun stop(context: Context) {
                      context.stopService(Intent(context, FamilyLocationService::class.java))
                  }
              }

              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private lateinit var locationManager: LocationManager
              private var trackingStarted = false
              @Volatile private var publishing = false
              @Volatile private var lastPublishedAt = 0L
              @Volatile private var lastPublishedLocation: Location? = null

              private val listener = object : LocationListener {
                  override fun onLocationChanged(location: Location) = handleLocation(location)
                  override fun onProviderEnabled(provider: String) = Unit
                  override fun onProviderDisabled(provider: String) = Unit
                  @Deprecated("Deprecated in Android")
                  override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) = Unit
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, buildNotification())
                  locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (!sharingEnabled() || !hasLocationPermission()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startTracking()
                  publishRecentCachedLocation()
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  runCatching { locationManager.removeUpdates(listener) }
                  serviceScope.cancel()
                  super.onDestroy()
              }

              private fun hasLocationPermission(): Boolean =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                      ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED

              private fun sharingEnabled(): Boolean {
                  val prefs = getSharedPreferences(LOCATION_PREFS, Context.MODE_PRIVATE)
                  return prefs.getBoolean("sharing_enabled", false) &&
                      !prefs.getString("device_member_id", null).isNullOrBlank()
              }

              private fun startTracking() {
                  if (trackingStarted || !hasLocationPermission()) return
                  trackingStarted = true
                  val providers = listOf(
                      Triple(LocationManager.NETWORK_PROVIDER, 30_000L, 20f),
                      Triple(LocationManager.GPS_PROVIDER, 45_000L, 20f)
                  )
                  providers.forEach { (provider, minTime, minDistance) ->
                      runCatching {
                          if (locationManager.isProviderEnabled(provider)) {
                              locationManager.requestLocationUpdates(provider, minTime, minDistance, listener)
                          }
                      }
                  }
              }

              private fun publishRecentCachedLocation() {
                  if (!hasLocationPermission()) return
                  val newest = listOf(LocationManager.NETWORK_PROVIDER, LocationManager.GPS_PROVIDER)
                      .mapNotNull { provider -> runCatching { locationManager.getLastKnownLocation(provider) }.getOrNull() }
                      .maxByOrNull { it.time }
                      ?: return
                  if (System.currentTimeMillis() - newest.time <= 2 * 60_000L) {
                      handleLocation(newest)
                  }
              }

              private fun handleLocation(location: Location) {
                  if (!sharingEnabled()) {
                      stopSelf()
                      return
                  }
                  if (location.hasAccuracy() && location.accuracy > MAX_ACCEPTED_ACCURACY_M) return
                  if (location.time > 0 && System.currentTimeMillis() - location.time > 2 * 60_000L) return
                  if (publishing) return

                  val now = System.currentTimeMillis()
                  val previous = lastPublishedLocation
                  val movedEnough = previous == null || previous.distanceTo(location) >= MIN_PUBLISH_DISTANCE_M
                  val dueForHeartbeat = now - lastPublishedAt >= MIN_PUBLISH_INTERVAL_MS
                  if (!movedEnough && !dueForHeartbeat) return

                  publishing = true
                  serviceScope.launch {
                      try {
                          val session = currentSession() ?: return@launch
                          val locationPrefs = getSharedPreferences(LOCATION_PREFS, Context.MODE_PRIVATE)
                          val memberId = locationPrefs.getString("device_member_id", null) ?: return@launch
                          val showBattery = locationPrefs.getBoolean("battery_visible", true)

                          FamilyLocationSync.publishLocation(
                              session = session,
                              memberId = memberId,
                              latitude = location.latitude,
                              longitude = location.longitude,
                              accuracyM = location.accuracy.takeIf { location.hasAccuracy() && it > 0f },
                              batteryPercent = if (showBattery) batteryPercent() else null
                          )

                          lastPublishedAt = System.currentTimeMillis()
                          lastPublishedLocation = Location(location)

                          runCatching {
                              val locations = FamilyLocationSync.loadLocations(session)
                              val places = FamilyLocationSync.loadPlaces(session)
                              val members = SupabaseSync.loadMembers(session).filter { it.id != ALL_FAMILY_MEMBER_ID }
                              checkLocationTransitions(applicationContext, session.id, locations, places, members)
                          }
                      } finally {
                          publishing = false
                      }
                  }
              }

              private fun currentSession(): FamilySession? {
                  val prefs = getSharedPreferences(FAMILY_PREFS, Context.MODE_PRIVATE)
                  val id = prefs.getString("family_id", null) ?: return null
                  val name = prefs.getString("family_name", "Min familj") ?: "Min familj"
                  val code = prefs.getString("family_code", null) ?: return null
                  if (code.isBlank()) return null
                  return FamilySession(id, name, code)
              }

              private fun batteryPercent(): Int? =
                  (getSystemService(Context.BATTERY_SERVICE) as BatteryManager)
                      .getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      .takeIf { it in 0..100 }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              "Platsdelning i bakgrunden",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "Håller familjens platsdelning uppdaterad även när appen inte är öppen."
                          }
                      )
                  }
              }

              private fun buildNotification(): Notification {
                  val openApp = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingFlags = PendingIntent.FLAG_UPDATE_CURRENT or
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0
                  val pendingIntent = PendingIntent.getActivity(this, 0, openApp, pendingFlags)
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_launcher_calendar)
                      .setContentTitle("Familjekalendern")
                      .setContentText("Platsdelning aktiv i bakgrunden")
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pendingIntent)
                      .build()
              }
          }
          KOTLIN

      - name: Commit app changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-location-background-and-collapsed-defaults.yml
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt \
                  app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt \
                  app/src/main/java/se/familjekalender/app/FamilyLocationService.kt \
                  app/src/main/java/se/familjekalender/app/MainActivity.kt \
                  app/src/main/AndroidManifest.xml
          git commit -m "Keep location sharing active in background"
          git push origin HEAD:main
