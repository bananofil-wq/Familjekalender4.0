name: Apply world-class Week v2

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_worldclass_week_v2.py'
      - '.github/workflows/apply-worldclass-week-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Week v2 patch
        run: python scripts/apply_worldclass_week_v2.py

      - name: Commit Week v2
        run: |
          if git diff --quiet -- app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt; then
            echo "Week v2 already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git commit -m "Upgrade week overview to v2"
          git push origin main

# Trigger marker: week-v2-ready
