name: Apply grouped day overview

on:
  push:
    paths:
      - '.github/workflows/apply-day-popup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Group same-person activities in day popup
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()

          fn_start = s.index('@Composable\nprivate fun DayOverviewPopup(')
          next_fn = s.find('\n@Composable\n', fn_start + 20)
          if next_fn == -1:
              raise SystemExit('Could not find end of DayOverviewPopup')

          block = s[fn_start:next_fn]
          if 'val groupedEvents = events.groupBy { it.memberId }' in block:
              print('Grouped day overview already applied')
          else:
              needle = '                    events.forEach { event ->'
              loop_start = block.find(needle)
              if loop_start == -1:
                  raise SystemExit('DayOverviewPopup events loop not found')

              brace_start = block.find('{', loop_start)
              depth = 0
              loop_end = None
              for i in range(brace_start, len(block)):
                  ch = block[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          loop_end = i + 1
                          break
              if loop_end is None:
                  raise SystemExit('Could not resolve DayOverviewPopup events loop')

              loop_text = block[loop_start:loop_end]
              first_newline = loop_text.find('\n')
              body = loop_text[first_newline + 1:-1]

              grouped = '''                    val groupedEvents = events.groupBy { it.memberId }
                    groupedEvents.forEach { (memberId, personEvents) ->
                        val groupMember = members.find { it.id == memberId }
                        val groupName = groupMember?.name
                            ?: if (memberId == ALL_FAMILY_MEMBER_ID) "Hela familjen" else "Familjen"
                        val groupColor = if (memberId == ALL_FAMILY_MEMBER_ID) {
                            Color(0xFFFFD75E)
                        } else {
                            groupMember?.let { Color(it.colorArgb.toInt()) } ?: Color(0xFF8D95A5)
                        }
                        var expanded by remember(date, memberId) {
                            mutableStateOf(personEvents.size == 1)
                        }

                        if (personEvents.size > 1) {
                            Surface(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .clickable { expanded = !expanded },
                                shape = RoundedCornerShape(16.dp),
                                color = Color.White.copy(alpha = .055f),
                                border = BorderStroke(1.dp, groupColor.copy(alpha = .28f))
                            ) {
                                Row(
                                    modifier = Modifier
                                        .fillMaxWidth()
                                        .padding(horizontal = 14.dp, vertical = 13.dp),
                                    verticalAlignment = Alignment.CenterVertically
                                ) {
                                    Box(
                                        Modifier
                                            .size(10.dp)
                                            .clip(CircleShape)
                                            .background(groupColor)
                                    )
                                    Spacer(Modifier.width(10.dp))
                                    Column(Modifier.weight(1f)) {
                                        Text(
                                            groupName,
                                            color = Color.White,
                                            fontWeight = FontWeight.SemiBold,
                                            fontSize = 17.sp
                                        )
                                        Text(
                                            "${personEvents.size} aktiviteter",
                                            color = Color.White.copy(alpha = .62f),
                                            fontSize = 13.sp
                                        )
                                    }
                                    Text(
                                        if (expanded) "Dölj" else "Visa alla",
                                        color = groupColor,
                                        fontWeight = FontWeight.SemiBold,
                                        fontSize = 13.sp
                                    )
                                }
                            }
                        }

                        if (expanded) {
                            personEvents.sortedBy { it.time }.forEach { event ->
__ORIGINAL_BODY__
                            }
                        }
                    }'''.replace('__ORIGINAL_BODY__', body)

              block = block[:loop_start] + grouped + block[loop_end:]
              s = s[:fn_start] + block + s[next_fn:]
              p.write_text(s)

      - name: Compile debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-grouped-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Group day activities by family member"
            git push origin main
          fi
