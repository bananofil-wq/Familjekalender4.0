name: Apply day popup

on:
  push:
    paths:
      - 'scripts/add-day-popup.py'
      - '.github/workflows/apply-day-popup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply day popup patch
        run: python3 scripts/add-day-popup.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add day overview popup"
            git push origin main
          fi
