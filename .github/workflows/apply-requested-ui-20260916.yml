name: Apply requested UI 2026-09-16

on:
  push:
    branches:
      - feature/clean-identity-custom-widgets-attention-20260916
    paths:
      - build-triggers/requested-ui-20260916.txt

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clean-identity-custom-widgets-attention-20260916
          fetch-depth: 0

      - name: Apply requested UI patch
        run: python3 scripts/apply_20260916_requested_ui.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt \
                  app/src/main/java/se/familjekalender/app/FirstRunIdentityGate.kt \
                  app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt \
                  app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Implement requested clean, identity, widget and attention UX"
            git push origin HEAD:feature/clean-identity-custom-widgets-attention-20260916
          fi
