name: Fix school schedule end times

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/fix_school_schedule_end_times.py'
      - '.github/workflows/fix-school-schedule-end-times.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Persist school schedule end times
        run: python scripts/fix_school_schedule_end_times.py
      - name: Commit school schedule fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/SchoolScheduleDialog.kt
          git diff --cached --quiet || git commit -m "Persist school schedule end times"
          git push
