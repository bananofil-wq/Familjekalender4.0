# Signed release build for direct distribution and Android/Play registration
name: Build Signed Update APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  signed-update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      FAMILJEKALENDER_KEYSTORE_PATH: ${{ github.workspace }}/familjekalender-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Google Calendar and Personal mode fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/se/familjekalender/app/SupabaseSync.kt')
          s = p.read_text()
          anchor = '    suspend fun importSportAdmin(session: FamilySession, webcalUrl: String, memberId: String?): Int = withContext(Dispatchers.IO) {'
          if anchor not in s:
              raise SystemExit('Supabase importSportAdmin anchor not found')
          if 'suspend fun upsertExternalEvent(' not in s:
              fn = '''    suspend fun upsertExternalEvent(
        session: FamilySession,
        source: String,
        externalId: String,
        title: String,
        startsAt: ZonedDateTime,
        endsAt: ZonedDateTime?,
        memberId: String?
    ) = withContext(Dispatchers.IO) {
        val body = JSONObject()
            .put("family_id", session.id)
            .put("title", title)
            .put("starts_at", startsAt.toOffsetDateTime().toString())
            .put("source", source)
            .put("external_id", externalId)
            .put("updated_at", OffsetDateTime.now().toString())
        if (endsAt != null && endsAt.isAfter(startsAt)) body.put("ends_at", endsAt.toOffsetDateTime().toString())
        else body.put("ends_at", JSONObject.NULL)
        if (memberId == null || memberId == ALL_FAMILY_MEMBER_ID) body.put("member_id", JSONObject.NULL)
        else body.put("member_id", memberId)
        request(
            "POST",
            "/rest/v1/calendar_events?on_conflict=family_id,source,external_id",
            body,
            session.code,
            preferRepresentation = false,
            preferExtra = "resolution=merge-duplicates"
        )
    }

'''
              s = s.replace(anchor, fn + anchor, 1)
              p.write_text(s)

          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('RUNNING("Löpning & vardag", "Veckan, dagens åtaganden och löpningen i en lugn personlig vy")',
                        'RUNNING("Sportläge", "Träning, vardag, progression och familjens schema i en samlad vy")')
          s = s.replace('PERSONAL("Personligt", "Bygg din egen kalender med valbara delar och egen ordning")',
                        'PERSONAL("Personligt", "Customiza din egen vy: lägg till, ta bort, flytta och ändra storlek på alla dashboarddelar")')
          s = s.replace('UiLayoutMode.values().filter { it != UiLayoutMode.PERSONAL }.forEach { mode ->',
                        'UiLayoutMode.values().forEach { mode ->')
          p.write_text(s)

      - name: Apply shopping redesign
        run: python3 scripts/apply_simple_shopping_redesign.py

      - name: Persist source fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source fixes already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/SupabaseSync.kt
            git commit -m "Fix Google Calendar sync and restore Personal mode"
            git push origin HEAD:main
          fi

      - name: Set update version
        shell: bash
        run: |
          echo "FAMILJEKALENDER_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_VERSION_NAME=4.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore signing configuration
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.FAMILJEKALENDER_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing is not configured yet. Add the repository secret FAMILJEKALENDER_SIGNING_BUNDLE once."
            exit 0
          fi
          KEYSTORE_B64="${SIGNING_BUNDLE%%:*}"
          SIGNING_PASSWORD="${SIGNING_BUNDLE#*:}"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ] || [ "$KEYSTORE_B64" = "$SIGNING_BUNDLE" ]; then
            echo "Invalid FAMILJEKALENDER_SIGNING_BUNDLE format."
            exit 1
          fi
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FAMILJEKALENDER_KEYSTORE_PATH"
          test -s "$FAMILJEKALENDER_KEYSTORE_PATH"
          echo "FAMILJEKALENDER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_ALIAS=familjekalender" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify approved seasonal images
        if: steps.signing.outputs.configured == 'true'
        run: python3 scripts/verify-season-images.py

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Verify AAB signature
        if: steps.signing.outputs.configured == 'true'
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release files
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.aab"

      - name: Upload signed release artifacts
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-update-${{ env.FAMILJEKALENDER_VERSION_NAME }}
          path: |
            Familjekalender-${{ env.FAMILJEKALENDER_VERSION_NAME }}.apk
            Familjekalender-${{ env.FAMILJEKALENDER_VERSION_NAME }}.aab
          if-no-files-found: error

      - name: Publish latest app update
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${FAMILJEKALENDER_VERSION_NAME}" \
            "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" \
            "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.aab#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} AAB" \
            --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
            --notes "Signerad uppdatering för Familjekalendern. APK för direkt installation och AAB för Android/Play-distribution." \
            --latest
