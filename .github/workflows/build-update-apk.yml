name: Build Signed Update APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  signed-update:
    runs-on: ubuntu-latest
    env:
      FAMILJEKALENDER_KEYSTORE_PATH: ${{ github.workspace }}/familjekalender-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set update version
        shell: bash
        run: |
          VERSION_CODE=$((2090000000 + GITHUB_RUN_NUMBER))
          if [ "$VERSION_CODE" -le 2026091810 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Invalid Android versionCode: $VERSION_CODE" >&2
            exit 1
          fi
          echo "FAMILJEKALENDER_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_VERSION_NAME=4.3.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore signing configuration
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.FAMILJEKALENDER_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_BUNDLE:-}" || { echo "Signing bundle is missing"; exit 1; }
          KEYSTORE_B64="${SIGNING_BUNDLE%%:*}"
          SIGNING_PASSWORD="${SIGNING_BUNDLE#*:}"
          test -n "$KEYSTORE_B64"
          test -n "$SIGNING_PASSWORD"
          test "$KEYSTORE_B64" != "$SIGNING_BUNDLE"
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FAMILJEKALENDER_KEYSTORE_PATH"
          test -s "$FAMILJEKALENDER_KEYSTORE_PATH"
          echo "FAMILJEKALENDER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_ALIAS=familjekalender" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release file
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-update-${{ env.FAMILJEKALENDER_VERSION_NAME }}
          path: Familjekalender-${{ env.FAMILJEKALENDER_VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Publish latest app update
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_NOTES="$(git log -1 --pretty=format:%s)"
          gh release create "v${FAMILJEKALENDER_VERSION_NAME}" \
            "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" \
            --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
            --notes "Nytt i denna version:\n\n• ${RELEASE_NOTES}" \
            --latest
