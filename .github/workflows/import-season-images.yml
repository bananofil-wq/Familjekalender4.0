name: Import approved seasonal images

on:
  push:
    branches:
      - fix/high-res-seasonal-images
    paths:
      - .github/workflows/import-season-images.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-res-seasonal-images

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download exact approved images and convert to WebP
        env:
          SPRING_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/bc0cd202-fa6d-42e8-a736-938e56cacd9f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDYxYmRiYjg4MGUzNTg3MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg0NTk0NH0.Yl92zHwqgIQUZ7y7MgrJNA629U3r8PYDWbPpKfR9D7o"
          SUMMER_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/922bedfe-ec27-430b-952a-29d2c65c6175.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWE0M2U4ODI5YWVkNDZjZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg4MDQ1MH0.z_BkyzQni-b-0tH_nwu4iewyXNNBy2zqPf8WRgBKNbE"
          AUTUMN_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/47d68aa5-6c1f-4c43-947f-7bbeb8737a50.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWE1OGU2NmE2OGMzMWJjMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg3NjA3NH0.nWDlwMlmmG7e4p04jZz7jPLxqAaxDiUj_5vHY1XXIWk"
          WINTER_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f030047a-55a8-47b3-a86f-ca5c900fad87.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDM3YjgzODU3NzBkYjQ0NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg0NzE3M30.Iq59_XM6wSDsTPzZZmq-9LliraHABRKlRncY1ud2QM0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/seasons
          curl --fail --location "$SPRING_URL" -o /tmp/seasons/spring.png
          curl --fail --location "$SUMMER_URL" -o /tmp/seasons/summer.png
          curl --fail --location "$AUTUMN_URL" -o /tmp/seasons/autumn.png
          curl --fail --location "$WINTER_URL" -o /tmp/seasons/winter.png

          for season in spring summer autumn winter; do
            dimensions=$(identify -format '%wx%h' "/tmp/seasons/$season.png")
            width=${dimensions%x*}
            height=${dimensions#*x}
            test "$width" -ge 1440
            test "$height" -ge 785
            cwebp -quiet -q 85 "/tmp/seasons/$season.png" -o "app/src/main/res/drawable-nodpi/season_$season.webp"
          done

          rm -f app/src/main/res/drawable-nodpi/season_spring.jpg
          rm -f app/src/main/res/drawable-nodpi/season_summer.jpg
          rm -f app/src/main/res/drawable-nodpi/season_autumn.jpg
          rm -f app/src/main/res/drawable-nodpi/season_winter.jpg

      - name: Remove one-time importer and commit binaries
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-season-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi .github/workflows/import-season-images.yml
          git commit -m "fix: replace seasonal backgrounds with high-resolution WebP assets"
          git push origin HEAD:fix/high-res-seasonal-images
