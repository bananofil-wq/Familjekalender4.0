name: Apply assistant layout v2

on:
  push:
    paths:
      - 'scripts/apply-assistant-layout-v2.py'
      - '.github/workflows/apply-assistant-layout-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout patch
        run: python scripts/apply-assistant-layout-v2.py
      - name: Commit layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git diff --cached --quiet || git commit -m "Move add action to assistant and remove day panel"
          git push
