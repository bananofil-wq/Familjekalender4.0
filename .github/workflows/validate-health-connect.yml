name: Validate Health Connect

on:
  push:
    branches: [ feature/health-connect-20260916 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build-health-connect.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-connect-validation-log
          path: build-health-connect.log
          if-no-files-found: error
