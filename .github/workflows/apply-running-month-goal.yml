name: Apply running monthly goal

on:
  push:
    paths:
      - 'scripts/apply_running_month_goal.py'
      - '.github/workflows/apply-running-month-goal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply running monthly goal patch
        run: python scripts/apply_running_month_goal.py
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          git diff --cached --quiet || git commit -m "Add running monthly distance goal"
          git push
