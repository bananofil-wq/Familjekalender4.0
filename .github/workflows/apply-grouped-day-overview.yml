name: Apply grouped day overview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-grouped-day-overview.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Group same-person activities in day popup
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()
          anchor = '''                } else {
                    events.forEach { event ->
                        val member = members.find { it.id == event.memberId }
'''
          replacement = '''                } else {
                    // Keep the day overview compact: one expandable card per person.
                    // Single-activity people stay expanded; multiple activities are collapsed initially.
                    val groupedEvents = events.groupBy { it.memberId }
                    groupedEvents.forEach { (memberId, personEvents) ->
                        val groupMember = members.find { it.id == memberId }
                        val groupName = groupMember?.name ?: if (memberId == ALL_FAMILY_MEMBER_ID) "Hela familjen" else "Familjen"
                        val groupColor = if (memberId == ALL_FAMILY_MEMBER_ID) Color(0xFFFFD75E) else groupMember?.let { Color(it.colorArgb.toInt()) } ?: Color(0xFF8D95A5)
                        var expanded by remember(date, memberId) { mutableStateOf(personEvents.size == 1) }

                        if (personEvents.size > 1) {
                            Surface(
                                modifier = Modifier.fillMaxWidth().clickable { expanded = !expanded },
                                shape = RoundedCornerShape(16.dp),
                                color = Color.White.copy(alpha = .055f),
                                border = BorderStroke(1.dp, groupColor.copy(alpha = .28f))
                            ) {
                                Row(
                                    Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 13.dp),
                                    verticalAlignment = Alignment.CenterVertically
                                ) {
                                    Box(Modifier.size(10.dp).clip(CircleShape).background(groupColor))
                                    Spacer(Modifier.width(10.dp))
                                    Column(Modifier.weight(1f)) {
                                        Text(groupName, color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 17.sp)
                                        Text("${personEvents.size} aktiviteter", color = Color.White.copy(alpha = .62f), fontSize = 13.sp)
                                    }
                                    Text(if (expanded) "Dölj" else "Visa alla", color = groupColor, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                                }
                            }
                            if (expanded) Spacer(Modifier.height(2.dp))
                        }

                        if (expanded) personEvents.sortedBy { it.time }.forEach { event ->
                        val member = members.find { it.id == event.memberId }
'''
          if anchor not in s:
              raise SystemExit('Day overview event-loop anchor not found')
          s = s.replace(anchor, replacement, 1)

          # Close the extra groupedEvents scope immediately after the existing event loop.
          tail = '''                            }
                        }
                    }
                }
            }
        },
'''
          replacement_tail = '''                            }
                        }
                        }
                    }
                }
            }
        },
'''
          if tail not in s:
              raise SystemExit('Day overview event-loop closing anchor not found')
          s = s.replace(tail, replacement_tail, 1)
          p.write_text(s)

      - name: Compile debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Commit grouped overview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git commit -m "Group day activities by family member"
          git push
