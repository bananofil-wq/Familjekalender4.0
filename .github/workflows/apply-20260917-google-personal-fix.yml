name: Fix Google Calendar and Personal mode
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-20260917-google-personal-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source fixes
        shell: python
        run: |
          from pathlib import Path

          # Google Calendar: add the missing Supabase upsert used by GoogleCalendarSync.
          p = Path('app/src/main/java/se/familjekalender/app/SupabaseSync.kt')
          s = p.read_text()
          anchor = '    suspend fun importSportAdmin(session: FamilySession, webcalUrl: String, memberId: String?): Int = withContext(Dispatchers.IO) {'
          if anchor not in s:
              raise SystemExit('Supabase importSportAdmin anchor not found')
          if 'suspend fun upsertExternalEvent(' not in s:
              fn = '''    suspend fun upsertExternalEvent(
        session: FamilySession,
        source: String,
        externalId: String,
        title: String,
        startsAt: ZonedDateTime,
        endsAt: ZonedDateTime?,
        memberId: String?
    ) = withContext(Dispatchers.IO) {
        val body = JSONObject()
            .put("family_id", session.id)
            .put("title", title)
            .put("starts_at", startsAt.toOffsetDateTime().toString())
            .put("source", source)
            .put("external_id", externalId)
            .put("updated_at", OffsetDateTime.now().toString())
        if (endsAt != null && endsAt.isAfter(startsAt)) body.put("ends_at", endsAt.toOffsetDateTime().toString())
        else body.put("ends_at", JSONObject.NULL)
        if (memberId == null || memberId == ALL_FAMILY_MEMBER_ID) body.put("member_id", JSONObject.NULL)
        else body.put("member_id", memberId)
        request(
            "POST",
            "/rest/v1/calendar_events?on_conflict=family_id,source,external_id",
            body,
            session.code,
            preferRepresentation = false,
            preferExtra = "resolution=merge-duplicates"
        )
    }

'''
              s = s.replace(anchor, fn + anchor, 1)
              p.write_text(s)

          # Restore Personal as the fourth visible UI mode and rename Running mode to Sport mode.
          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('RUNNING("Löpning & vardag", "Veckan, dagens åtaganden och löpningen i en lugn personlig vy")',
                        'RUNNING("Sportläge", "Träning, vardag, progression och familjens schema i en samlad vy")')
          s = s.replace('PERSONAL("Personligt", "Bygg din egen kalender med valbara delar och egen ordning")',
                        'PERSONAL("Personligt", "Customiza din egen vy: lägg till, ta bort, flytta och ändra storlek på alla dashboarddelar")')
          s = s.replace('UiLayoutMode.values().filter { it != UiLayoutMode.PERSONAL }.forEach { mode ->',
                        'UiLayoutMode.values().forEach { mode ->')
          p.write_text(s)

      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/se/familjekalender/app/SupabaseSync.kt app/src/main/java/se/familjekalender/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Source fixes already applied"
          else
            git commit -m "Fix Google Calendar sync and restore Personal mode"
            git push origin HEAD:main
          fi