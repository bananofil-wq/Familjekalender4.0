name: Apply laundry calendar option

on:
  push:
    branches: [ main ]
    paths:
      - '.laundry-calendar-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply laundry calendar patch
        run: python3 scripts/add_laundry_calendar_option.py

      - name: Commit patched app source
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git commit -m "Add laundry option to calendar"
          git push
