name: Validate selected day ring
on:
  push:
    branches: [fix/selected-day-icons-inside-ring-20260916]
permissions:
  contents: write
jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/selected-day-icons-inside-ring-20260916
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
