name: Apply family assistant card

on:
  push:
    paths:
      - 'scripts/add-family-assistant-card.py'
      - '.github/workflows/apply-family-assistant-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/add-family-assistant-card.py
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m "Integrate family assistant into calendar"
          git push
