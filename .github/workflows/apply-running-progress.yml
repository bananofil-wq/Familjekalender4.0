name: Apply running progress

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_running_progress.py'
      - '.github/workflows/apply-running-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply running progress integration
        run: python3 scripts/apply_running_progress.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Integrate running progress"
            git push origin main
          fi

