name: Validate Gmail OAuth Fix

on:
  push:
    branches: [ fix/gmail-oauth-account-picker-20260916 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gmail-oauth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/gmail-oauth-account-picker-20260916
      - name: Apply Gmail OAuth fix
        run: python3 scripts/fix_gmail_oauth_account_picker.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Persist validated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MailSettingsCard.kt app/src/main/java/se/familjekalender/app/MailSync.kt
          git commit -m "Fixa Gmail-kontoval och OAuth-flöde"
          git push
