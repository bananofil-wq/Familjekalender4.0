name: Force calendar Kotlin source patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch recurrence behavior and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = p.read_text()
          anchor = '    if (showAddEvent) {'
          start_scope = s.index(anchor)
          if 'val targetDates = if (recurrence == RecurrenceMode.NONE)' not in s[start_scope:]:
              else_pos = s.index('                } else {', start_scope)
              refresh_pos = s.index('                refresh()', else_pos)
              replacement = '''                } else {
                    val targetDates = if (recurrence == RecurrenceMode.NONE) {
                        dates.sorted()
                    } else {
                        dates.sorted().flatMap { recurringDates(it, recurrence) }.distinct().sorted()
                    }
                    targetDates.forEach { date ->
                        SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId)
                    }
                }
'''
              s = s[:else_pos] + replacement + s[refresh_pos:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Wire recurring events into calendar saving"
          git push
