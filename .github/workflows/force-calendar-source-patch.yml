name: Force calendar Kotlin source patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch remaining Kotlin blocks and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          exact = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = exact.read_text()
          old_start = '                    .weight(1.72f)\n                    .pointerInput(month) {'
          if old_start in s:
              start = s.index(old_start)
              end = s.index('\n            )', start)
              replacement = '''                    .weight(1.72f)
                    .graphicsLayer { translationX = monthDrag.value }
                    .pointerInput(month) {
                        detectHorizontalDragGestures(
                            onDragStart = { launch { monthDrag.stop() } },
                            onHorizontalDrag = { change, amount ->
                                change.consume()
                                launch { monthDrag.snapTo(monthDrag.value + amount) }
                            },
                            onDragEnd = {
                                launch {
                                    val width = size.width.toFloat().coerceAtLeast(1f)
                                    if (abs(monthDrag.value) >= width * 0.18f) {
                                        val direction = if (monthDrag.value < 0f) -1f else 1f
                                        monthDrag.animateTo(direction * width, tween(130))
                                        moveMonth(if (direction < 0f) 1 else -1)
                                        monthDrag.snapTo(-direction * width)
                                        monthDrag.animateTo(0f, tween(190))
                                    } else {
                                        monthDrag.animateTo(0f, tween(160))
                                    }
                                }
                            },
                            onDragCancel = { launch { monthDrag.animateTo(0f, tween(160)) } }
                        )
                    }'''
              s = s[:start] + replacement + s[end:]
          exact.write_text(s)

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          s = main.read_text()
          old = '''                } else {
                    dates.sorted().forEach { date ->
                        SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId)
                    }
                }'''
          new = '''                } else {
                    val targetDates = if (recurrence == RecurrenceMode.NONE) {
                        dates.sorted()
                    } else {
                        dates.sorted().flatMap { recurringDates(it, recurrence) }.distinct().sorted()
                    }
                    targetDates.forEach { date ->
                        SupabaseSync.addEvent(session, title, date, startTime, endTime, memberId)
                    }
                }'''
          if old in s:
              s = s.replace(old, new, 1)
          main.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt app/src/main/java/se/familjekalender/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Finish calendar swipe and recurring event behavior"
          git push
