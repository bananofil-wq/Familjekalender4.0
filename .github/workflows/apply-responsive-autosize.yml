name: Apply responsive autosize

on:
  push:
    branches: [ main ]
    paths:
      - '.build-trigger-responsive'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply responsive autosize patch
        run: python3 scripts/apply_responsive_autosize.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ToDoScreen.kt app/src/debug/java/se/familjekalender/app/DesignPreviewActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Apply responsive autosize and align add buttons"
          git push
