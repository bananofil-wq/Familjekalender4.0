name: Apply 2026-09-16 UI fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-20260916-ui-fixes.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        shell: python
        run: |
          from pathlib import Path

          # 1. Personal view: keep only the purple add button in the assistant card.
          p = Path('app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt')
          s = p.read_text()
          old = '''            FilledIconButton(onClick = onAdd) {
                Icon(Icons.Default.Add, contentDescription = "Lägg till aktivitet")
            }
'''
          if old not in s:
              raise SystemExit('Personal add button block not found')
          s = s.replace(old, '', 1)
          p.write_text(s)

          # 2. Calendar: remove the empty seasonal hero spacer so the month card starts at the top of the image.
          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()
          s = s.replace('val seasonalHeroMax = 135.dp', 'val seasonalHeroMax = 0.dp', 1)
          s = s.replace('val seasonalHeroMin = 72.dp', 'val seasonalHeroMin = 0.dp', 1)
          p.write_text(s)

          # 3. Assistant: make the attention card clickable and show every item in a detail dialog.
          p = Path('app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt')
          s = p.read_text()
          anchor = '    var todayPlanExpanded by remember { mutableStateOf(false) }\n'
          if anchor not in s:
              raise SystemExit('Assistant state anchor not found')
          s = s.replace(anchor, anchor + '    var showAttentionDetails by remember { mutableStateOf(false) }\n', 1)
          old = '                    modifier = Modifier.fillMaxWidth()\n                ) {\n                    Column(Modifier.padding(13.dp)) {\n                        Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                            Text("Behöver din uppmärksamhet", fontSize = 14.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.weight(1f))\n'
          new = '                    modifier = Modifier.fillMaxWidth().clickable { showAttentionDetails = true }\n                ) {\n                    Column(Modifier.padding(13.dp)) {\n                        Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                            Text("Behöver din uppmärksamhet", fontSize = 14.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.weight(1f))\n'
          if old not in s:
              raise SystemExit('Attention card anchor not found')
          s = s.replace(old, new, 1)
          dialog_anchor = '    popup?.let { selected ->\n'
          dialog = '''    if (showAttentionDetails) {
        AlertDialog(
            onDismissRequest = { showAttentionDetails = false },
            title = { Text("Behöver din uppmärksamhet") },
            text = {
                Column(
                    Modifier.fillMaxWidth().heightIn(max = 460.dp).verticalScroll(rememberScrollState()),
                    verticalArrangement = Arrangement.spacedBy(10.dp)
                ) {
                    conflicts.forEachIndexed { index, item ->
                        Surface(color = MaterialTheme.colorScheme.error.copy(alpha = .10f), shape = RoundedCornerShape(12.dp)) {
                            Column(Modifier.fillMaxWidth().padding(12.dp)) {
                                Text("Krock ${index + 1}", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.error, fontSize = 12.sp)
                                Text(item, color = Color.White, fontSize = 12.sp)
                            }
                        }
                    }
                    planning.forEachIndexed { index, item ->
                        Surface(color = Color.White.copy(alpha = .05f), shape = RoundedCornerShape(12.dp)) {
                            Column(Modifier.fillMaxWidth().padding(12.dp)) {
                                Text("Att planera ${index + 1}", fontWeight = FontWeight.Bold, color = Color.White, fontSize = 12.sp)
                                Text(item, color = Color.White.copy(alpha = .88f), fontSize = 12.sp)
                            }
                        }
                    }
                    actions.forEachIndexed { index, item ->
                        Surface(color = MaterialTheme.colorScheme.primary.copy(alpha = .10f), shape = RoundedCornerShape(12.dp)) {
                            Column(Modifier.fillMaxWidth().padding(12.dp)) {
                                Text("Förslag ${index + 1}", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary, fontSize = 12.sp)
                                Text(item, color = Color.White, fontSize = 12.sp)
                            }
                        }
                    }
                }
            },
            confirmButton = { TextButton(onClick = { showAttentionDetails = false }) { Text("Stäng") } }
        )
    }

'''
          if dialog_anchor not in s:
              raise SystemExit('Dialog insertion anchor not found')
          s = s.replace(dialog_anchor, dialog + dialog_anchor, 1)
          p.write_text(s)
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git commit -m "Fix duplicate add button, attention details and calendar position"
          git push
