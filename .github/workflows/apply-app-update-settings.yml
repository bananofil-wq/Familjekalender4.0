name: Apply app update Settings UI

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply_app_update_settings.py'
      - '.github/workflows/apply-app-update-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Settings updater patch
        run: python3 scripts/apply_app_update_settings.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m "Add update controls to Settings"
          git push
