name: Fix compressed calendar layout

on:
  push:
    paths:
      - 'scripts/fix-calendar-compression.py'
      - '.github/workflows/fix-calendar-compression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calendar sizing fix
        run: python scripts/fix-calendar-compression.py
      - name: Commit calendar sizing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git diff --cached --quiet || git commit -m "Stop calendar grid from being vertically compressed"
          git push
