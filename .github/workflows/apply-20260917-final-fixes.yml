name: Apply 2026-09-17 remaining UI fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-20260917-final-fixes.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch remaining requested UI behavior
        shell: python
        run: |
          from pathlib import Path

          # 1. Force a fresh, explicit "Vem är du?" confirmation on the next app build.
          p = Path('app/src/main/java/se/familjekalender/app/FirstRunIdentityGate.kt')
          s = p.read_text()
          old = 'private const val IDENTITY_CONFIRMATION_VERSION = "20260916_v2"'
          new = 'private const val IDENTITY_CONFIRMATION_VERSION = "20260917_v3"'
          if old not in s:
              raise SystemExit('Identity confirmation version anchor not found')
          p.write_text(s.replace(old, new, 1))

          # 2. Clean mode: reserve the lower-right half as a genuinely free slot.
          p = Path('app/src/main/java/se/familjekalender/app/MinimalCalendarScreen.kt')
          s = p.read_text()
          old = '''        Button(
            onClick = onAdd,
            modifier = Modifier.fillMaxWidth().height(56.dp),
            shape = RoundedCornerShape(20.dp),
            colors = ButtonDefaults.buttonColors(
                containerColor = MaterialTheme.colorScheme.primary,
                contentColor = MaterialTheme.colorScheme.onPrimary
            ),
            elevation = ButtonDefaults.buttonElevation(defaultElevation = 0.dp, pressedElevation = 0.dp)
        ) {
            Icon(Icons.Default.Add, contentDescription = null, modifier = Modifier.size(22.dp))
            Spacer(Modifier.width(9.dp))
            Text("Lägg till aktivitet", style = MaterialTheme.typography.labelLarge)
        }
'''
          new = '''        Row(
            modifier = Modifier.fillMaxWidth(),
            horizontalArrangement = Arrangement.spacedBy(12.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            Button(
                onClick = onAdd,
                modifier = Modifier.weight(1f).height(56.dp),
                shape = RoundedCornerShape(20.dp),
                colors = ButtonDefaults.buttonColors(
                    containerColor = MaterialTheme.colorScheme.primary,
                    contentColor = MaterialTheme.colorScheme.onPrimary
                ),
                elevation = ButtonDefaults.buttonElevation(defaultElevation = 0.dp, pressedElevation = 0.dp)
            ) {
                Icon(Icons.Default.Add, contentDescription = null, modifier = Modifier.size(22.dp))
                Spacer(Modifier.width(7.dp))
                Text("Lägg till", style = MaterialTheme.typography.labelLarge)
            }

            // Avsiktligt fri yta nere till höger i Clean-läget.
            // Den reserveras så att nästa snabbfunktion kan läggas här utan att layouten behöver göras om.
            Spacer(Modifier.weight(1f).height(56.dp))
        }
'''
          if old not in s:
              raise SystemExit('Clean add-button anchor not found')
          p.write_text(s.replace(old, new, 1))

          # 3. Personal mode: tapping an unselected widget anywhere selects it for widget-style editing.
          p = Path('app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt')
          s = p.read_text()
          old = '''            Box(
                Modifier
                    .fillMaxWidth()
                    .then(if (editMode) Modifier.clickable(onClick = onSelect) else Modifier)
            ) {
                content()
            }
'''
          new = '''            Box(Modifier.fillMaxWidth()) {
                content()
                if (editMode && !selected) {
                    Box(
                        Modifier
                            .matchParentSize()
                            .clickable(onClick = onSelect)
                    )
                }
            }
'''
          if old not in s:
              raise SystemExit('Personal widget selection anchor not found')
          p.write_text(s.replace(old, new, 1))

          # 4. Guard: the attention card must remain clickable and open its detail dialog.
          p = Path('app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt')
          s = p.read_text()
          required = [
              'modifier = Modifier.fillMaxWidth().clickable { showAttentionDetails = true }',
              'if (showAttentionDetails) {',
              'Text("Behöver din uppmärksamhet"'
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Attention details integration missing: ' + repr(missing))

      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/se/familjekalender/app/FirstRunIdentityGate.kt \
                  app/src/main/java/se/familjekalender/app/MinimalCalendarScreen.kt \
                  app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt
          git commit -m "Fix Clean free slot, identity prompt and personal widget editing"
          git push
