name: Phase 2 real event end times

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/phase2_use_real_end_times.py'
      - '.github/workflows/phase2-real-end-times.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Use stored end times in assistant
        run: python scripts/phase2_use_real_end_times.py
      - name: Commit assistant end-time support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git diff --cached --quiet || git commit -m "Use real event end times in family assistant"
          git push
