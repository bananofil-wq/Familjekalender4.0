name: Apply Simple Shopping Redesign

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_simple_shopping_redesign.py'
      - '.github/workflows/apply-simple-shopping-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply shopping redesign
        run: python scripts/apply_simple_shopping_redesign.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m "Redesign shopping list and remove price comparison"
          git push origin main
