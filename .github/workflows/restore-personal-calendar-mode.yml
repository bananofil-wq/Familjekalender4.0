name: Restore personal calendar mode

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-personal-calendar-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore third personal layout option
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          text = main.read_text()

          text = text.replace(
              '    PERSONAL("Anpassad", "Avancerad modulvy")',
              '    PERSONAL("Personligt", "Helt anpassningsbar vy där du lägger till, tar bort, flyttar och ändrar storlek på alla delar.")',
              1
          )
          text = text.replace(
              '    PERSONAL("Personligt", "Bygg din egen kalender med valbara delar och egen ordning")',
              '    PERSONAL("Personligt", "Helt anpassningsbar vy där du lägger till, tar bort, flyttar och ändrar storlek på alla delar.")',
              1
          )
          text = text.replace(
              'Text("Välj mellan en ren kalender och en vardagsvy med löpningen i fokus. Valet sparas på den här telefonen.", color = Muted, fontSize = 12.sp)',
              'Text("Välj Clean, Löpning & vardag eller Personligt. I Personligt bestämmer du själv vilka delar som visas och kan lägga till, ta bort, flytta och ändra storlek på dem. Valet sparas på den här telefonen.", color = Muted, fontSize = 12.sp)',
              1
          )
          text = text.replace(
              'UiLayoutMode.values().filter { it != UiLayoutMode.PERSONAL }.forEach { mode ->',
              'UiLayoutMode.values().forEach { mode ->',
              1
          )
          main.write_text(text)

          personal = Path('app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt')
          p = personal.read_text()
          p = p.replace(
              'Text("Personliga layouter", fontWeight = FontWeight.Bold, fontSize = 16.sp)',
              'Text("Personligt läge", fontWeight = FontWeight.Bold, fontSize = 16.sp)',
              1
          )
          p = p.replace(
              'Text("Tre separata profiler. Varje profil sparar egna moduler och egen ordning.", color = Muted, fontSize = 12.sp)',
              'Text("Bygg kalendern som du vill ha den. Välj vilka delar som ska visas, ändra ordningen och spara upp till tre egna layouter.", color = Muted, fontSize = 12.sp)',
              1
          )
          # Startsidan i Personligt visar aldrig lägesnamnet "Personligt". Endast ett frivilligt eget profilnamn kan visas.
          personal.write_text(p)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt
          git commit -m "Restore personal calendar mode"
          git push origin main
# build trigger after personal mode restoration
# retrigger 2026-09-17: restore selectable fully customizable Personal mode without a mode-name heading on home
