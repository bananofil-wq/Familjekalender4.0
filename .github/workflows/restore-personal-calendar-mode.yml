name: Restore personal calendar mode

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  restore-personal-mode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore third personal layout option
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          text = main.read_text()

          old_enum = '''enum class UiLayoutMode(val label: String, val description: String) {
    FULL("Löpning & vardag", "Veckan, dagens åtaganden och löpningen i en lugn personlig vy"),
    MINIMAL("Clean", "Ren månadskalender med en diskret markering per dag"),
    PERSONAL("Anpassad", "Avancerad modulvy")
}'''
          new_enum = '''enum class UiLayoutMode(val label: String, val description: String) {
    MINIMAL("Clean", "Ren månadskalender med en diskret markering per dag"),
    FULL("Löpning & vardag", "Veckan, dagens åtaganden och löpningen i en lugn personlig vy"),
    PERSONAL("Personligt", "Bygg din egen kalender med valbara delar och egen ordning")
}'''
          if old_enum not in text:
              raise SystemExit('Expected UiLayoutMode block not found')
          text = text.replace(old_enum, new_enum, 1)

          old_intro = 'Text("Välj mellan en ren kalender och en vardagsvy med löpningen i fokus. Valet sparas på den här telefonen.", color = Muted, fontSize = 12.sp)'
          new_intro = 'Text("Välj Clean, Löpning & vardag eller Personligt. I Personligt bestämmer du själv vilka delar kalendern ska visa och i vilken ordning. Valet sparas på den här telefonen.", color = Muted, fontSize = 12.sp)'
          if old_intro not in text:
              raise SystemExit('Expected settings intro not found')
          text = text.replace(old_intro, new_intro, 1)

          old_modes = 'UiLayoutMode.values().filter { it != UiLayoutMode.PERSONAL }.forEach { mode ->'
          new_modes = 'UiLayoutMode.values().forEach { mode ->'
          if old_modes not in text:
              raise SystemExit('Expected filtered layout mode list not found')
          text = text.replace(old_modes, new_modes, 1)
          main.write_text(text)

          personal = Path('app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt')
          p = personal.read_text()
          p = p.replace('Text("Personliga layouter", fontWeight = FontWeight.Bold, fontSize = 16.sp)', 'Text("Personligt läge", fontWeight = FontWeight.Bold, fontSize = 16.sp)', 1)
          p = p.replace('Text("Tre separata profiler. Varje profil sparar egna moduler och egen ordning.", color = Muted, fontSize = 12.sp)', 'Text("Bygg kalendern som du vill ha den. Välj vilka delar som ska visas, ändra ordningen och spara upp till tre egna layouter.", color = Muted, fontSize = 12.sp)', 1)
          personal.write_text(p)
          PY
      - name: Commit personal mode restoration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/PersonalLayoutScreen.kt
          git commit -m "Restore personal calendar mode"
          git push
