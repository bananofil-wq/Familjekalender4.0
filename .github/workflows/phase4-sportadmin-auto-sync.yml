name: Phase 4 SportAdmin automatic sync

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/phase4_sportadmin_auto_sync.py'
      - '.github/workflows/phase4-sportadmin-auto-sync.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Upgrade SportAdmin integration
        run: python scripts/phase4_sportadmin_auto_sync.py
      - name: Commit SportAdmin changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git diff --cached --quiet || git commit -m "Add automatic SportAdmin member sync"
          git push
