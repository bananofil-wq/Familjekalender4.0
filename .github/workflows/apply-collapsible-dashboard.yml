name: Apply collapsible dashboard cards

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-collapsible-dashboard.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Dagens plan, Veckan and Familjeautopilot collapsible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    var popup by remember { mutableStateOf<AssistantPopup?>(null) }\n    var selectedMember by remember { mutableStateOf<SyncMember?>(null) }''',
              '''    var popup by remember { mutableStateOf<AssistantPopup?>(null) }\n    var selectedMember by remember { mutableStateOf<SyncMember?>(null) }\n    var todayPlanExpanded by remember { mutableStateOf(true) }''',
              'today state'
          )

          replace_once(
              '''            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                Text("Dagens plan", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.weight(1f))\n                Text("${todaysEvents.size} aktiviteter", fontSize = 11.sp, color = Muted)\n            }\n            Spacer(Modifier.height(8.dp))''',
              '''            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                Text("Dagens plan", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.weight(1f))\n                TextButton(\n                    onClick = { todayPlanExpanded = !todayPlanExpanded },\n                    contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),\n                    modifier = Modifier.height(32.dp)\n                ) {\n                    Text(\n                        "${todaysEvents.size} aktiviteter  ${if (todayPlanExpanded) "▲" else "▼"}",\n                        fontSize = 11.sp,\n                        color = Muted\n                    )\n                }\n            }\n            if (todayPlanExpanded) {\n                Spacer(Modifier.height(8.dp))''',
              'today header'
          )

          replace_once(
              '''                if (todaysEvents.size > 5) {\n                    TextButton(onClick = { popup = AssistantPopup.TODAY }, modifier = Modifier.align(Alignment.End)) {\n                        Text("Visa alla ${todaysEvents.size}")\n                    }\n                }\n            }\n\n            val realMembers = members.filter { it.id != ALL_FAMILY_MEMBER_ID }''',
              '''                if (todaysEvents.size > 5) {\n                    TextButton(onClick = { popup = AssistantPopup.TODAY }, modifier = Modifier.align(Alignment.End)) {\n                        Text("Visa alla ${todaysEvents.size}")\n                    }\n                }\n            }\n            }\n\n            val realMembers = members.filter { it.id != ALL_FAMILY_MEMBER_ID }''',
              'today close'
          )

          replace_once(
              '''    var selectedWeekDay by remember { mutableStateOf<WeekDaySummary?>(null) }''',
              '''    var selectedWeekDay by remember { mutableStateOf<WeekDaySummary?>(null) }\n    var weekExpanded by remember { mutableStateOf(true) }''',
              'week state'
          )

          replace_once(
              '''                Text(weekState, fontSize = 10.sp, color = stateColor, fontWeight = FontWeight.Bold)\n            }\n\n            Spacer(Modifier.height(12.dp))''',
              '''                Column(horizontalAlignment = Alignment.End) {\n                    Text(weekState, fontSize = 10.sp, color = stateColor, fontWeight = FontWeight.Bold)\n                    TextButton(\n                        onClick = { weekExpanded = !weekExpanded },\n                        contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),\n                        modifier = Modifier.height(30.dp)\n                    ) {\n                        Text(if (weekExpanded) "Minimera ▲" else "Visa ▼", fontSize = 10.sp, color = Muted)\n                    }\n                }\n            }\n\n            if (weekExpanded) {\n                Spacer(Modifier.height(12.dp))''',
              'week header'
          )

          replace_once(
              '''        }\n    }\n\n    selectedWeekDay?.let { day ->''',
              '''            }\n        }\n    }\n\n    selectedWeekDay?.let { day ->''',
              'week close'
          )

          replace_once(
              '''    val locale = Locale("sv", "SE")\n    val suggestions = mutableListOf<Pair<String, String>>()''',
              '''    val locale = Locale("sv", "SE")\n    val suggestions = mutableListOf<Pair<String, String>>()\n    var autopilotExpanded by remember { mutableStateOf(true) }''',
              'autopilot state'
          )

          replace_once(
              '''                Text("AUTO", fontSize = 10.sp, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)\n            }\n\n            Spacer(Modifier.height(12.dp))''',
              '''                Column(horizontalAlignment = Alignment.End) {\n                    Text("AUTO", fontSize = 10.sp, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)\n                    TextButton(\n                        onClick = { autopilotExpanded = !autopilotExpanded },\n                        contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),\n                        modifier = Modifier.height(30.dp)\n                    ) {\n                        Text(if (autopilotExpanded) "Minimera ▲" else "Visa ▼", fontSize = 10.sp, color = Muted)\n                    }\n                }\n            }\n\n            if (autopilotExpanded) {\n                Spacer(Modifier.height(12.dp))''',
              'autopilot header'
          )

          replace_once(
              '''        }\n    }\n}\n\n@Composable\nprivate fun MemberTwoDayPopup''',
              '''            }\n        }\n    }\n}\n\n@Composable\nprivate fun MemberTwoDayPopup''',
              'autopilot close'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Collapsible dashboard already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git commit -m "Make dashboard sections collapsible"
          git push origin HEAD:main
