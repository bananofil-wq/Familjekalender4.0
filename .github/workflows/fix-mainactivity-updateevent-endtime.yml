name: Fix MainActivity updateEvent end time

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - scripts/fix-mainactivity-updateevent-endtime.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Patch MainActivity updateEvent call
        run: python3 scripts/fix-mainactivity-updateevent-endtime.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Preserve event end time in family editor"
          git push origin HEAD:feature/family-planning-phase1
