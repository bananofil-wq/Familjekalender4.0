name: Apply world-class Today dashboard

on:
  push:
    paths:
      - 'scripts/apply_worldclass_today_dashboard.py'
      - '.github/workflows/apply-worldclass-today-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Today dashboard patch
        run: python3 scripts/apply_worldclass_today_dashboard.py

      - name: Commit dashboard
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git commit -m 'Upgrade family Today dashboard'
          git push origin main
