name: Best family experience phase 3

on:
  push:
    branches: [feature/best-family-experience]
    paths:
      - 'app/src/main/java/se/familjekalender/app/RecurringLifeCard.kt'
      - '.github/workflows/best-family-experience-phase3.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
