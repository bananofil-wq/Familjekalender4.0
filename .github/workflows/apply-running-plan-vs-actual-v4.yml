name: Apply running plan versus actual v4

on:
  push:
    paths:
      - 'scripts/apply_running_plan_vs_actual_v4.py'
      - '.github/workflows/apply-running-plan-vs-actual-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_running_plan_vs_actual_v4.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/RunningProgressCard.kt
          git diff --cached --quiet && exit 0
          git commit -m "Show planned versus actual running results"
          git push
