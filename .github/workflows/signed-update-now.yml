name: Signed Update Now

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/signed-update-now.yml'
      - '.github/signed-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-update:
    runs-on: ubuntu-latest
    env:
      FAMILJEKALENDER_KEYSTORE_PATH: ${{ github.workspace }}/familjekalender-release.jks
      FAMILJEKALENDER_VERSION_CODE: '2026091810'
      FAMILJEKALENDER_VERSION_NAME: '4.3.20260918.10'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Initialize build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          printf 'checkout\n' > /tmp/familjekalender-build-stage
          : > /tmp/familjekalender-build.log

      - name: Restore permanent release signing key
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.FAMILJEKALENDER_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          printf 'restore-signing-key\n' > /tmp/familjekalender-build-stage
          if [ -z "${SIGNING_BUNDLE:-}" ]; then
            echo 'FAMILJEKALENDER_SIGNING_BUNDLE is not configured.' >&2
            exit 1
          fi
          KEYSTORE_B64="${SIGNING_BUNDLE%%:*}"
          SIGNING_PASSWORD="${SIGNING_BUNDLE#*:}"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ] || [ "$KEYSTORE_B64" = "$SIGNING_BUNDLE" ]; then
            echo 'Invalid signing bundle format.' >&2
            exit 1
          fi
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FAMILJEKALENDER_KEYSTORE_PATH"
          test -s "$FAMILJEKALENDER_KEYSTORE_PATH"
          echo "FAMILJEKALENDER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_ALIAS=familjekalender" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          printf 'gradle-assemble-release\n' > /tmp/familjekalender-build-stage
          gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/familjekalender-build.log

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          printf 'verify-apk-signature\n' > /tmp/familjekalender-build-stage
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare update APK
        shell: bash
        run: |
          set -euo pipefail
          printf 'prepare-update-apk\n' > /tmp/familjekalender-build-stage
          cp app/build/outputs/apk/release/app-release.apk Familjekalender-4.3.20260918.10.apk

      - name: Mark artifact upload stage
        shell: bash
        run: printf 'upload-artifact\n' > /tmp/familjekalender-build-stage

      - name: Upload verified signed update
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-signed-update-4.3.20260918.10
          path: Familjekalender-4.3.20260918.10.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest app update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'publish-github-release\n' > /tmp/familjekalender-build-stage
          cat > release-notes.txt <<'EOF'
          Förfinad Clean-kalender och stabilare synk.

          • Den lila ringen runt valt datum är borttagen; dagens datum visas som en neutral transparent 3D-glasbubbla.
          • Glasbubblan har tydligare djup, ljusreflex och aktivitetsprickarna ligger kvar inuti.
          • Kalenderns 30-minuterssynk pausas i bakgrunden och återupptas när appen används.
          • Notisbehörighet hanteras efter familjeinställningen och kan återställas via inställningar efter nekad behörighet.
          • SportAdmin-importen hanterar TZID, återkommande aktiviteter och sluttider robustare.
          • HTTP-anslutningar stängs korrekt efter Supabase- och SportAdmin-anrop.
          EOF
          TAG="v${FAMILJEKALENDER_VERSION_NAME}"
          APK="Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" --clobber
            gh release edit "$TAG" \
              --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
              --notes-file release-notes.txt \
              --latest
          else
            gh release create "$TAG" \
              "$APK#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" \
              --target main \
              --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
              --notes-file release-notes.txt \
              --latest
          fi

      - name: Mark signed APK verified
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p build-triggers
          SUCCESS_MARKER="build-triggers/signed-verified-${FAMILJEKALENDER_VERSION_NAME}.txt"
          FAILURE_MARKER="build-triggers/signed-failed-${FAMILJEKALENDER_VERSION_NAME}.txt"
          rm -f "$FAILURE_MARKER"
          printf 'Signed APK verified and release published: %s\n' "${FAMILJEKALENDER_VERSION_NAME}" > "$SUCCESS_MARKER"
          git add -A build-triggers
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify signed APK ${FAMILJEKALENDER_VERSION_NAME}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Mark signed APK build failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p build-triggers
          FAILURE_MARKER="build-triggers/signed-failed-${FAMILJEKALENDER_VERSION_NAME}.txt"
          STAGE="$(cat /tmp/familjekalender-build-stage 2>/dev/null || printf 'unknown')"
          {
            printf 'Signed APK build failed: %s\n' "${FAMILJEKALENDER_VERSION_NAME}"
            printf 'Stage: %s\n' "$STAGE"
            printf 'Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n'
            if [ -s /tmp/familjekalender-build.log ]; then
              printf '\nCompiler errors:\n'
              grep -E '(^|[[:space:]])(e:|error:)|Unresolved reference|Type mismatch|No parameter with name|None of the following candidates|Compilation error' /tmp/familjekalender-build.log | tail -n 120 || true
              printf '\nRelevant source mentions:\n'
              grep -E 'MinimalCalendarScreen|MainActivity|\.kt:' /tmp/familjekalender-build.log | tail -n 120 || true
              printf '\nLast Gradle output:\n'
              tail -n 120 /tmp/familjekalender-build.log
            fi
          } > "$FAILURE_MARKER"
          git add "$FAILURE_MARKER"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Signed APK failed ${FAMILJEKALENDER_VERSION_NAME}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
