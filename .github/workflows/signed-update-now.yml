name: Signed Update Now

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/signed-update-now.yml'
      - '.github/signed-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-update:
    runs-on: ubuntu-latest
    env:
      FAMILJEKALENDER_KEYSTORE_PATH: ${{ github.workspace }}/familjekalender-release.jks
      FAMILJEKALENDER_VERSION_CODE: '2026091802'
      FAMILJEKALENDER_VERSION_NAME: '4.3.20260918.2'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore permanent release signing key
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.FAMILJEKALENDER_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE:-}" ]; then
            echo 'FAMILJEKALENDER_SIGNING_BUNDLE is not configured.' >&2
            exit 1
          fi
          KEYSTORE_B64="${SIGNING_BUNDLE%%:*}"
          SIGNING_PASSWORD="${SIGNING_BUNDLE#*:}"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ] || [ "$KEYSTORE_B64" = "$SIGNING_BUNDLE" ]; then
            echo 'Invalid signing bundle format.' >&2
            exit 1
          fi
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FAMILJEKALENDER_KEYSTORE_PATH"
          test -s "$FAMILJEKALENDER_KEYSTORE_PATH"
          echo "FAMILJEKALENDER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_ALIAS=familjekalender" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare update APK
        run: cp app/build/outputs/apk/release/app-release.apk Familjekalender-4.3.20260918.2.apk

      - name: Upload verified signed update
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-signed-update-4.3.20260918.2
          path: Familjekalender-4.3.20260918.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest app update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          Interaktionsfix för Clean-läget.

          • Aktivitetsraderna i dagens agenda går nu att trycka på och visar aktivitetens detaljer.
          • Hela väderkortet använder en explicit klickbar yta och öppnar Inställningar.
          • Behåller premiumdesignen och widgetfixarna från föregående version.
          EOF
          TAG="v${FAMILJEKALENDER_VERSION_NAME}"
          APK="Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" --clobber
            gh release edit "$TAG" \
              --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
              --notes-file release-notes.txt \
              --latest
          else
            gh release create "$TAG" \
              "$APK#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" \
              --target main \
              --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
              --notes-file release-notes.txt \
              --latest
          fi

      - name: Mark signed APK verified
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p build-triggers
          MARKER="build-triggers/signed-verified-${FAMILJEKALENDER_VERSION_NAME}.txt"
          printf 'Signed APK verified and release published: %s\n' "${FAMILJEKALENDER_VERSION_NAME}" > "$MARKER"
          git add "$MARKER"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify signed APK ${FAMILJEKALENDER_VERSION_NAME}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
