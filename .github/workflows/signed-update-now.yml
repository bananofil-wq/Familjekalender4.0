name: Signed Update Now

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/signed-update-now.yml'
      - '.github/signed-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-update:
    runs-on: ubuntu-latest
    env:
      FAMILJEKALENDER_KEYSTORE_PATH: ${{ github.workspace }}/familjekalender-release.jks
      FAMILJEKALENDER_VERSION_CODE: '2026091705'
      FAMILJEKALENDER_VERSION_NAME: '4.3.20260917.5'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore permanent release signing key
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.FAMILJEKALENDER_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_BUNDLE:-}" ]; then
            echo 'FAMILJEKALENDER_SIGNING_BUNDLE is not configured.' >&2
            exit 1
          fi
          KEYSTORE_B64="${SIGNING_BUNDLE%%:*}"
          SIGNING_PASSWORD="${SIGNING_BUNDLE#*:}"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ] || [ "$KEYSTORE_B64" = "$SIGNING_BUNDLE" ]; then
            echo 'Invalid signing bundle format.' >&2
            exit 1
          fi
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FAMILJEKALENDER_KEYSTORE_PATH"
          test -s "$FAMILJEKALENDER_KEYSTORE_PATH"
          echo "FAMILJEKALENDER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_ALIAS=familjekalender" >> "$GITHUB_ENV"
          echo "FAMILJEKALENDER_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare update APK
        run: cp app/build/outputs/apk/release/app-release.apk Familjekalender-4.3.20260917.5.apk

      - name: Upload verified signed update
        uses: actions/upload-artifact@v4
        with:
          name: Familjekalender-signed-update-4.3.20260917.5
          path: Familjekalender-4.3.20260917.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest app update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          Nyheter sedan 4.3.311: tydligare kalender, bättre platsnotiser och smidigare uppdateringar.

          • Aktiviteter grupperas per person i dagsöversikten i alla kalenderlägen. Tryck på personens kort för att visa alla aktiviteter.

          • Platsnotiser kan styras per familjemedlem och är avstängda som standard tills du själv aktiverar dem.

          • Appen använder signerade uppdateringar som kan installeras ovanpå den befintliga versionen utan att appdata behöver tas bort.

          • Efter en uppdatering visas nu en liten informationsruta med en kort sammanfattning. Tryck på Mer för en mer ingående lista över vad som ändrats.
          EOF
          gh release create "v${FAMILJEKALENDER_VERSION_NAME}" \
            "Familjekalender-${FAMILJEKALENDER_VERSION_NAME}.apk#Familjekalender ${FAMILJEKALENDER_VERSION_NAME} APK" \
            --target main \
            --title "Familjekalender ${FAMILJEKALENDER_VERSION_NAME}" \
            --notes-file release-notes.txt \
            --latest
