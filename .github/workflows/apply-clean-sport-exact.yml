name: Apply Clean and Sport mode redesign

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-clean-sport-exact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved Clean and Sport changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/se/familjekalender/app/MainActivity.kt')
          text = main.read_text()
          text = text.replace(
              'RUNNING("Löpning & vardag", "Veckan, dagens åtaganden och löpningen i en lugn personlig vy")',
              'RUNNING("Sportläge", "Löpning i fokus med träningspass, progression, schema och återhämtning")'
          )
          text = text.replace(
              '                            events = events,\n                            members = members,\n                            onAdd = {',
              '                            events = events,\n                            members = members,\n                            session = session,\n                            shopping = shopping,\n                            onAdd = {',
              1
          )
          # Running belongs only to Sport mode: remove the running card from Full mode.
          text = re.sub(
              r'\n\s*RunningProgressCard\(\n\s*session = session,\n\s*members = members\.filter \{ it\.id != ALL_FAMILY_MEMBER_ID \},\n\s*events = events,\n\s*onChanged = \{\n\s*refresh\(\)\n\s*FamilyCalendarWidget\.enqueueRefresh\(context\)\n\s*\}\n\s*\)',
              '', text, count=1
          )
          # Remove running card from the generic Family tab. Sport mode owns running UI.
          text = re.sub(
              r'\n\s*RunningProgressCard\(\n\s*session = session,\n\s*members = members\.filter \{ it\.id != ALL_FAMILY_MEMBER_ID \},\n\s*events = events,\n\s*onChanged = \{\n\s*refresh\(\)\n\s*FamilyCalendarWidget\.enqueueRefresh\(context\)\n\s*\}\n\s*\)\n\s*Spacer\(Modifier\.height\(10\.dp\)\)',
              '', text, count=1
          )
          # Clean bottom bar: Settings must be the fixed lower-right destination.
          old_nav = '''            Triple(0, Icons.Default.CalendarMonth, "Kalender"),
            Triple(1, Icons.Default.ShoppingCart, "Inköp"),
            Triple(2, Icons.Default.CheckCircle, "To-do"),
            Triple(3, Icons.Default.People, "Familj"),
            Triple(5, Icons.Default.LocationOn, "Plats")'''
          new_nav = '''            Triple(0, Icons.Default.CalendarMonth, "Kalender"),
            Triple(1, Icons.Default.ShoppingCart, "Inköp"),
            Triple(2, Icons.Default.CheckCircle, "Att göra"),
            Triple(3, Icons.Default.People, "Familj"),
            Triple(4, Icons.Default.Settings, "Inställningar")'''
          text = text.replace(old_nav, new_nav)
          text = text.replace('        5 -> 4\n        else -> -1', '        4 -> 4\n        else -> -1')
          text = text.replace(
              'Text("Välj Clean, Löpning & vardag eller Personligt.',
              'Text("Välj Clean, Sportläge eller Personligt.'
          )
          main.write_text(text)

          clean = Path('app/src/main/java/se/familjekalender/app/MinimalCalendarScreen.kt')
          c = clean.read_text()
          c = c.replace(
              '    members: List<SyncMember>,\n    onAdd: () -> Unit,',
              '    members: List<SyncMember>,\n    session: FamilySession,\n    shopping: List<SyncShoppingItem>,\n    onAdd: () -> Unit,'
          )
          # Remove the old top-right settings button; settings now lives in lower-right nav exactly as approved.
          c = re.sub(
              r'''\n\s*Surface\(\n\s*shape = RoundedCornerShape\(17\.dp\),\n\s*color = LuxurySurfaceElevated,\n\s*border = BorderStroke\(1\.dp, LuxuryOutlineSoft\)\n\s*\) \{\n\s*IconButton\(onClick = onOpenSettings, modifier = Modifier\.size\(48\.dp\)\) \{\n\s*Icon\(\n\s*Icons\.Default\.Settings,\n\s*contentDescription = "Inställningar",\n\s*tint = MaterialTheme\.colorScheme\.onSurfaceVariant,\n\s*modifier = Modifier\.size\(24\.dp\)\n\s*\)\n\s*\}\n\s*\}''',
              '', c, count=1
          )
          # Replace Dagens agenda with the real assistant in Clean mode.
          start = c.find('        AnimatedContent(\n            targetState = selectedDate,')
          end_marker = '        Spacer(Modifier.height(18.dp))\n\n        Button('
          end = c.find(end_marker, start)
          if start != -1 and end != -1:
              assistant = '''        FamilyAssistantCard(
            session = session,
            events = events,
            members = members,
            shopping = shopping,
            onAdd = onAdd
        )

'''
              c = c[:start] + assistant + c[end:]
          # Approved wording from the exact mockup.
          c = c.replace('"Familjeappen"', '"Familjekalendern"', 1)
          c = c.replace('"Mer tid tillsammans"', '"Tillsammans får vi livet att gå runt"', 1)
          clean.write_text(c)
          PY
      - name: Commit app changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/MinimalCalendarScreen.kt
          git commit -m "Apply exact Clean layout and Sport mode separation"
          git push origin main
