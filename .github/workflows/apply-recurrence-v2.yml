name: Apply recurrence v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch recurrence source
        run: python3 scripts/patch_recurrence.py
      - name: Apply Week v2
        run: python3 scripts/apply_worldclass_week_v2.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git commit -m "Apply recurrence wiring and Week v2"
          git push
