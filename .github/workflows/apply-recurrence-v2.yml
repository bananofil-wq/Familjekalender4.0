name: Apply recurrence v2

on:
  push:
    paths:
      - 'scripts/patch_recurrence.py'
      - '.github/workflows/apply-recurrence-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch recurrence source
        run: python3 scripts/patch_recurrence.py
      - name: Commit recurrence source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No recurrence source change needed"
            exit 0
          fi
          git commit -m "Apply recurrence wiring"
          git push
