name: Apply portrait and shopping safety

on:
  push:
    paths:
      - 'scripts/apply_portrait_and_shopping_safety.py'
      - '.github/workflows/apply-portrait-shopping-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply portrait and shopping safety patch
        run: python3 scripts/apply_portrait_and_shopping_safety.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/AndroidManifest.xml app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m 'Lock portrait and confirm shopping deletion'
          git push origin main
