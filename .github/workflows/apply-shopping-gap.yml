name: Apply shopping gap

on:
  push:
    paths:
      - 'scripts/add-shopping-gap.py'
      - '.github/workflows/apply-shopping-gap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply shopping gap patch
        run: python3 scripts/add-shopping-gap.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt
          git commit -m 'Add gap below shopping input'
          git push origin main
