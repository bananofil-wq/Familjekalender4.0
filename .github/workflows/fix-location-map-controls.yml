name: Fix location map controls

on:
  push:
    paths:
      - '.github/workflows/fix-location-map-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply map controls patch
        run: python scripts/fix_location_map_controls.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt
          git diff --cached --quiet || git commit -m "Fix location map zoom position and layers"
          git push
