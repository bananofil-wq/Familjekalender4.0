name: Apply clickable week details

on:
  push:
    paths:
      - 'scripts/apply_week_click_details.py'
      - '.github/workflows/apply-week-click-details.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply clickable week details
        run: python scripts/apply_week_click_details.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Make week activities open actionable details"
          git push origin main

# Reapplied after recurrence workflow was corrected so this interaction cannot be overwritten again.
