name: Fix mail sync compile

on:
  push:
    paths:
      - 'scripts/fix_mail_sync_compile.py'
      - '.github/workflows/fix-mail-sync-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compile fixes
        run: python scripts/fix_mail_sync_compile.py
      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/MailSettingsCard.kt
          git commit -m "Fix mail sync compilation"
          git push
