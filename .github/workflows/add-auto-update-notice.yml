name: Apply automatic update notification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-auto-update-notice.py'
      - '.github/workflows/add-auto-update-notice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/add-auto-update-notice.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/se/familjekalender/app/AppUpdate.kt app/src/main/java/se/familjekalender/app/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Notify automatically when app update is available"
          git push
