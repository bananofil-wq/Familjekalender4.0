name: Apply location map zoom fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve GPS map interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt')
          text = path.read_text()

          old = '''                    MapView(context).apply {
                        setTileSource(TileSourceFactory.MAPNIK)
                        setMultiTouchControls(true)
                        controller.setZoom(13.0)
                        mapView = this
                    }
'''
          new = '''                    MapView(context).apply {
                        setTileSource(TileSourceFactory.MAPNIK)
                        setMultiTouchControls(true)
                        setBuiltInZoomControls(false)
                        setMinZoomLevel(4.0)
                        setMaxZoomLevel(20.0)
                        controller.setZoom(17.0)
                        setOnTouchListener { view, event ->
                            when (event.actionMasked) {
                                android.view.MotionEvent.ACTION_DOWN,
                                android.view.MotionEvent.ACTION_POINTER_DOWN,
                                android.view.MotionEvent.ACTION_MOVE ->
                                    view.parent?.requestDisallowInterceptTouchEvent(true)
                                android.view.MotionEvent.ACTION_UP,
                                android.view.MotionEvent.ACTION_CANCEL ->
                                    view.parent?.requestDisallowInterceptTouchEvent(false)
                            }
                            false
                        }
                        mapView = this
                    }
'''
          if old not in text:
              print('GPS map patch already applied; nothing to change')
              raise SystemExit(0)
          text = text.replace(old, new, 1)

          marker = '''            )

            selected?.let { item ->
'''
          controls = '''            )

            Column(
                modifier = Modifier.align(Alignment.TopEnd).padding(12.dp),
                verticalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                SmallFloatingActionButton(
                    onClick = { mapView?.controller?.zoomIn() },
                    containerColor = Color(0xEE17151F),
                    contentColor = Color.White
                ) {
                    Icon(Icons.Default.Add, contentDescription = "Zooma in")
                }
                SmallFloatingActionButton(
                    onClick = { mapView?.controller?.zoomOut() },
                    containerColor = Color(0xEE17151F),
                    contentColor = Color.White
                ) {
                    Icon(Icons.Default.Remove, contentDescription = "Zooma ut")
                }
            }

            selected?.let { item ->
'''
          if marker not in text:
              raise SystemExit('Expected map controls insertion point not found')
          text = text.replace(marker, controls, 1)

          path.write_text(text)
          PY

      - name: Commit map fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt
          git commit -m "Improve GPS map zoom and gestures"
          git push
