name: Phase 2 assistant calendar accuracy

on:
  workflow_dispatch:
  push:
    branches: [ feature/family-assistant-phase2 ]
    paths:
      - 'scripts/phase2_assistant_calendar_accuracy.py'
      - '.github/workflows/phase2-assistant-calendar-accuracy.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-assistant-phase2
      - name: Apply assistant accuracy patch
        run: python3 scripts/phase2_assistant_calendar_accuracy.py
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo 'No source changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/se/familjekalender/app/FamilyAssistantScreen.kt
            git commit -m 'Use buffered calendar gaps in family assistant'
            git push origin HEAD:feature/family-assistant-phase2
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify approved seasonal images
        run: python3 scripts/verify-season-images.py
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
