name: Fix seasonal background full width

on:
  push:
    paths:
      - '.github/workflows/fix-season-background-fillwidth.yml'

permissions:
  contents: write

jobs:
  fix-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve full image width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt')
          s = p.read_text()
          old = 'contentScale = ContentScale.Crop'
          new = 'contentScale = ContentScale.FillWidth'
          if old not in s:
              raise SystemExit('Expected Crop setting not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve full width of seasonal backgrounds'
          git push
