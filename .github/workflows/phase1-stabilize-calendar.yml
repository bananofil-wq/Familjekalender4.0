name: Phase 1 stabilize calendar

on:
  push:
    branches:
      - feature/family-planning-phase1
    paths:
      - 'scripts/phase1_stabilize_calendar.py'
      - '.github/workflows/phase1-stabilize-calendar.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-planning-phase1
      - name: Apply deterministic calendar sizing
        run: python scripts/phase1_stabilize_calendar.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/ExactCalendarScreen.kt
          git diff --cached --quiet || git commit -m "Stabilize calendar layout across screen sizes"
          git push
