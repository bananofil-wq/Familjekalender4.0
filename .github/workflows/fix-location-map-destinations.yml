name: Fix location map and destinations

on:
  push:
    paths:
      - 'scripts/fix_location_map_destinations.py'
      - '.github/workflows/fix-location-map-destinations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply location patch
        run: python scripts/fix_location_map_destinations.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/se/familjekalender/app/FamilyLocationScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix map rendering and add destination search"
          git push
