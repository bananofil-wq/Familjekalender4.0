name: Apply mail sync

on:
  push:
    paths:
      - 'scripts/apply_mail_sync.py'
      - '.github/workflows/apply-mail-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mail sync integration
        run: python scripts/apply_mail_sync.py
      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/se/familjekalender/app/SupabaseSync.kt app/src/main/java/se/familjekalender/app/MainActivity.kt app/src/main/java/se/familjekalender/app/MailSync.kt app/src/main/java/se/familjekalender/app/MailSettingsCard.kt
          git commit -m "Add automatic mail calendar and offer sync"
          git push
